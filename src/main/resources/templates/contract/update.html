<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Modificar Contrato - OVI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="/css/proyecte.css" th:href="@{/css/proyecte.css}"/>
</head>
<body>

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container pb-5">
    <h1 class="mb-2 text-primary fw-bold">Modificación de Contrato</h1>
    <p class="text-muted mb-4">Actualice las fechas del contrato. Los datos de identificación, el estado y la ubicación del archivo son administrativos y no pueden ser modificados.</p>

    <hr class="mb-4 text-muted">

    <form class="form-horizontal" th:action="@{/contract/update}" th:object="${contract}" method="post">

        <h5 class="text-primary text-opacity-75 mb-3 fw-bold">1. Fechas del Contrato</h5>

        <div class="form-group row mb-3">
            <label for="startDate" class="control-label col-sm-2">Fecha de inicio:</label>
            <div class="col-sm-4">
                <input type="date" class="form-control" id="startDate" th:field="*{startDate}" />
                <div th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" class="text-danger"></div>
            </div>
        </div>

        <div class="form-group row mb-3">
            <label for="endDate" class="control-label col-sm-2">Fecha fin:</label>
            <div class="col-sm-4">
                <input type="date" class="form-control" id="endDate" th:field="*{endDate}" />
                <div th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}" class="text-danger"></div>
            </div>
        </div>

        <hr class="mb-4 text-muted">

        <h5 class="text-primary text-opacity-75 mb-3 fw-bold">2. Información Administrativa</h5>

        <div class="form-group row mb-3">
            <label for="contract_Id" class="control-label col-sm-2">ID del Contrato: </label>
            <div class="col-sm-4">
                <input id="contract_Id" type="text" th:field="*{contract_Id}" class="form-control bg-light" maxlength="20" readonly>
                <div th:if="${#fields.hasErrors('contract_Id')}" th:errors="*{contract_Id}" class="text-danger"></div>
            </div>
        </div>

        <div class="form-group row mb-3">
            <label for="request_Id" class="control-label col-sm-2">ID de la Solicitud: </label>
            <div class="col-sm-4">
                <input id="request_Id" type="text" th:field="*{request_Id}" class="form-control bg-light" maxlength="20" readonly>
                <div th:if="${#fields.hasErrors('request_Id')}" th:errors="*{request_Id}" class="text-danger"></div>
            </div>
        </div>

        <div class="form-group row mb-3">
            <label for="pappati_id" class="control-label col-sm-2">DNI del PAP/PATI:</label>
            <div class="col-sm-4">
                <input type="text" class="form-control bg-light" id="pappati_id" th:field="*{pappati_id}" maxlength="9" readonly />
                <div th:if="${#fields.hasErrors('pappati_id')}" th:errors="*{pappati_id}" class="text-danger"></div>
            </div>
        </div>

        <div class="form-group row mb-3">
            <label for="status" class="control-label col-sm-2">Estado:</label>
            <div class="col-sm-4">
                <input type="text" class="form-control bg-light" id="status" th:field="*{status}" readonly />
                <div th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="text-danger"></div>
            </div>
        </div>

        <div class="form-group row mb-3">
            <label for="placeWhereThePDFIsGonnaBeSaved" class="control-label col-sm-2">Ubicación del PDF:</label>
            <div class="col-sm-10">
                <input type="text" class="form-control bg-light" id="placeWhereThePDFIsGonnaBeSaved" th:field="*{placeWhereThePDFIsGonnaBeSaved}" maxlength="150" readonly />
                <div th:if="${#fields.hasErrors('placeWhereThePDFIsGonnaBeSaved')}" th:errors="*{placeWhereThePDFIsGonnaBeSaved}" class="text-danger"></div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Actualizar Contrato</button>
        <a th:href="@{/contract/user/{dni}(dni=${user.dni})}" class="btn btn-secondary mt-3 ms-2">Volver</a>
    </form>
</main>
</body>
</html>
