<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <title>Mis Solicitudes</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/proyecte.css}"/>
</head>
<body>
<nav class="navbar navbar-light bg-light mb-4 shadow-sm">
    <div th:replace="~{fragments/base :: navbar}"></div>
</nav>

<main class="container mt-4">
    <h1 class="mb-4">Mis Solicitudes</h1>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Tipo de servicio</th>
                <th>Disponibilidad</th>
                <th>Localización</th>
                <th>Formación requerida</th>
                <th>Experiencia requerida</th>
                <th>Habilidades requeridas</th>
                <th>Estado</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="assignmentRequest: ${assignmentRequests}">
                <td th:text="${assignmentRequest.request_Id}"></td>
                <td th:text="${assignmentRequest.requestDate}"></td>
                <td th:text="${assignmentRequest.typeOfService}"></td>
                <td th:text="${assignmentRequest.requiredStartAvailability} + ' - ' + ${assignmentRequest.requiredEndAvailability}"></td>
                <td th:text="${assignmentRequest.serviceLocation}"></td>
                <td th:text="${assignmentRequest.requiredTraining}"></td>
                <td th:text="${assignmentRequest.requiredExperience}"></td>
                <td th:text="${assignmentRequest.requiredSkills}"></td>

                <!-- Estado con badge y motivo de rechazo si aplica -->
                <td>
                    <span th:text="${assignmentRequest.status}"
                          th:class="${assignmentRequest.status == 'in progress' ?
                                    'badge bg-warning text-dark' :
                                    (assignmentRequest.status == 'accepted' ?
                                    'badge bg-success' : 'badge bg-danger')}">
                    </span>
                    <div th:if="${assignmentRequest.status == 'refused' and assignmentRequest.rejectReason != null}"
                         class="text-muted small mt-1">
                        <strong>Motivo:</strong>
                        <em th:text="${assignmentRequest.rejectReason}"></em>
                    </div>
                </td>

                <!-- Acciones según estado -->
                <td class="text-center">
                    <!-- En progreso: puede editar o borrar -->
                    <div th:if="${assignmentRequest.status == 'in progress'}" class="d-flex gap-1 justify-content-center">
                        <a th:href="@{/assignmentRequest/update/{id}(id=${assignmentRequest.request_Id})}"
                           class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/assignmentRequest/delete/{id}(id=${assignmentRequest.request_Id})}"
                           class="btn btn-danger btn-sm">Eliminar</a>
                    </div>

                    <!-- Aceptada: puede ver los candidatos propuestos -->
                    <div th:if="${assignmentRequest.status == 'accepted'}">
                        <a th:href="@{/assignmentRequest/proposals/{id}(id=${assignmentRequest.request_Id})}"
                           class="btn btn-info btn-sm">Ver candidatos</a>
                    </div>

                    <!-- Rechazada: sin acciones, el motivo ya se ve en la columna Estado -->
                    <div th:if="${assignmentRequest.status == 'refused'}">
                        <span class="text-muted small">Sin acciones disponibles</span>
                    </div>
                </td>
            </tr>

            <!-- Fila vacía -->
            <tr th:if="${#lists.isEmpty(assignmentRequests)}">
                <td colspan="10" class="text-center text-muted p-4">
                    No tienes solicitudes registradas aún.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3 d-flex gap-2">
        <a th:href="@{/assignmentRequest/add}" class="btn btn-primary">Nueva solicitud</a>
        <a href="/dashboard" class="btn btn-secondary">Volver</a>

    </div>
</main>
</body>
</html>
