<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Crear una Solicitud de Asignación - OVI</title>
  <link rel="icon" href="https://ovicastello.org/wp-content/uploads/2020/08/cropped-LOGO_Mesa-de-trabajo-1.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" type="text/css" href="/css/proyecte.css" th:href="@{/css/proyecte.css}"/>
</head>
<body>

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container pb-5">
  <h1 class="mb-0 align-middle">
    <i class="bi bi-clipboard-plus me-2" style="font-size: 2rem; color: #0d9488; vertical-align: middle;"></i>Nueva solicitud de asignación
  </h1>
  <p class="text-muted mb-4">Por favor, rellene los requisitos necesarios para generar una nueva solicitud de servicio.</p>

  <hr class="mb-4 text-muted">

  <form class="form-horizontal" th:action="@{/assignmentRequest/add}" th:object="${assignmentRequest}" method="post">

    <h5 class="text-primary text-opacity-75 mb-3 fw-bold">1. Detalles del Servicio</h5>

    <div class="form-group row mb-3 align-items-center">
      <label class="control-label col-sm-2 fw-bold">Tipo de Servicio:</label>
      <div class="col-sm-10">
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" id="tipoPAP" th:field="*{typeOfService}" value="PAP">
          <label class="form-check-label fw-normal" for="tipoPAP">PAP</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" id="tipoPATI" th:field="*{typeOfService}" value="PATI">
          <label class="form-check-label fw-normal" for="tipoPATI">PATI</label>
        </div>
        <div th:if="${#fields.hasErrors('typeOfService')}" th:errors="*{typeOfService}" class="text-danger d-block mt-1"></div>
      </div>
    </div>

    <div class="form-group row mb-3">
      <label for="requiredStartAvailability" class="control-label col-sm-2">Fecha de inicio:</label>
      <div class="col-sm-4">
        <input type="date" class="form-control" id="requiredStartAvailability" th:field="*{requiredStartAvailability}" th:attr="min=${#temporals.format(todayMin, 'yyyy-MM-dd')}"/>
        <div th:if="${#fields.hasErrors('requiredStartAvailability')}" th:errors="*{requiredStartAvailability}" class="text-danger"></div>
      </div>
    </div>

    <div class="form-group row mb-3">
      <label for="requiredEndAvailability" class="control-label col-sm-2">Fecha de fin:</label>
      <div class="col-sm-4">
        <input type="date" class="form-control" id="requiredEndAvailability" th:field="*{requiredEndAvailability}" th:attr="min=${#temporals.format(tomorrowMin, 'yyyy-MM-dd')}"/>
        <div th:if="${#fields.hasErrors('requiredEndAvailability')}" th:errors="*{requiredEndAvailability}" class="text-danger"></div>
      </div>
    </div>

    <div class="form-group row mb-3">
      <label for="serviceLocation" class="control-label col-sm-2">Ubicación (Provincia):</label>
      <div class="col-sm-4">
        <select class="form-select" id="serviceLocation" th:field="*{serviceLocation}">
          <option value="" disabled>Seleccione una provincia...</option>
          <option th:each="provincia : ${provincias}" th:value="${provincia}" th:text="${provincia}"></option>
        </select>
        <div th:if="${#fields.hasErrors('serviceLocation')}" th:errors="*{serviceLocation}" class="text-danger"></div>
      </div>
    </div>

    <hr class="mb-4 text-muted">

    <h5 class="text-primary text-opacity-75 mb-3 fw-bold">2. Requisitos Profesionales</h5>

    <div class="form-group row mb-3">
      <label for="requiredTraining" class="control-label col-sm-2">Formación requerida:</label>
      <div class="col-sm-10">
        <select class="form-select" id="requiredTraining" th:field="*{requiredTraining}">
          <option value="" disabled>Seleccione la formación mínima...</option>
          <option th:each="training : ${formacionesDisponibles}" th:value="${training}" th:text="${training}"></option>
        </select>
        <div th:if="${#fields.hasErrors('requiredTraining')}" th:errors="*{requiredTraining}" class="text-danger"></div>
      </div>
    </div>

    <div class="form-group row mb-3">
      <label for="requiredExperience" class="control-label col-sm-2">Experiencia necesaria:</label>
      <div class="col-sm-4">
        <select class="form-select" id="requiredExperience" th:field="*{requiredExperience}">
          <option value="" disabled>Seleccione años de experiencia...</option>
          <option th:each="anyo : ${anyosExperiencia}" th:value="${anyo}" th:text="${anyo}"></option>
        </select>
        <div th:if="${#fields.hasErrors('requiredExperience')}" th:errors="*{requiredExperience}" class="text-danger"></div>
      </div>
    </div>

    <div th:if="${user.role == 'tutor'}" class="form-group row mb-3">
      <label for="oviuserSelect" class="control-label col-sm-2 fw-bold">Usuario OVI:</label>
      <div class="col-sm-4">
        <select class="form-select" id="oviuserSelect" th:field="*{oviuser_id}" required>
          <option value="" disabled selected>Seleccione un usuario OVI...</option>
          <option th:each="ovi : ${oviUsers}"
                  th:value="${ovi.dni}"
                  th:text="${ovi.dni} + ' - ' + ${ovi.name}"
                  th:selected="${ovi.dni == assignmentRequest.oviuser_id}">
          </option>
        </select>
        <div th:if="${#fields.hasErrors('oviuser_id')}" th:errors="*{oviuser_id}" class="text-danger"></div>
      </div>
    </div>

    <div class="form-group row mb-3">
      <label class="control-label col-sm-2">Habilidades requeridas:</label>
      <div class="col-sm-10">
        <div class="row pt-1">
            <div th:each="skill : ${skillsDisponibles}" class="col-md-4 col-sm-6 mb-2">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="requiredSkills" th:value="${skill}">
              <label class="form-check-label fw-normal" th:text="${skill}"></label>
            </div>
          </div>
        </div>
        <div th:if="${#fields.hasErrors('requiredSkills')}" th:errors="*{requiredSkills}" class="text-danger mt-1"></div>
      </div>
    </div>

    <button type="submit" class="btn btn-primary mt-3">Registrar Solicitud</button>
    <a href="/assignmentRequest/list" class="btn btn-secondary mt-3 ms-2">Volver</a>
  </form>
</main>
</body>
</html>
