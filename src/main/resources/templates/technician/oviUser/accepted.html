<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <title>OVI Users Registrados</title>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://ovicastello.org/wp-content/uploads/2020/08/cropped-LOGO_Mesa-de-trabajo-1.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/proyecte.css}"/>
</head>
<body>

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container pb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0 align-middle">
            <i class="bi bi-person-check me-2" style="font-size: 2rem; color: #0d9488; vertical-align: middle;"></i>Usuarios OVI registrados
        </h1>
    </div>

    <hr class="mb-4 text-muted">

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle text-center">
            <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Estado</th>
                <th class="text-center">Detalles</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="oviUser: ${oviUsers}">
                <td th:text="${oviUser.name}"></td>
                <td th:text="${oviUser.email}"></td>

                <td>
                    <span class="badge rounded-pill bg-success px-3 py-2">Aceptado</span>
                </td>

                <td class="text-center">
                    <a th:href="@{/oviUser/masdetalle/{dni}(dni=${oviUser.dni},from='accepted')}"
                       class="btn btn-secondary btn-sm px-4 py-2 shadow-sm fw-semibold">
                        <i class="bi bi-eye-fill me-1"></i> Ver perfil
                    </a>
                </td>

                <td class="text-center">
                    <div class="d-flex justify-content-center gap-2">
                        <a th:href="@{/oviUser/update/{dni}(dni=${oviUser.dni})}"
                           class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <a th:href="@{/oviUser/delete/{dni}(dni=${oviUser.dni})}"
                           class="btn btn-danger btn-sm">
                            Borrar
                        </a>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(oviUsers)}">
                <td colspan="5" class="text-center text-muted p-4">No hay usuarios registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${totalPages > 1}" aria-label="Navegación de usuarios OVI" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/oviUser/accepted(page=${currentPage - 1})}">&laquo;</a>
            </li>
            <li th:each="i : ${#numbers.sequence(1, totalPages)}" class="page-item" th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link" th:href="@{/oviUser/accepted(page=${i})}" th:text="${i}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/oviUser/accepted(page=${currentPage + 1})}">&raquo;</a>
            </li>
        </ul>
    </nav>

    <a href="/dashboard" class="btn btn-secondary mt-3">Volver</a>
</main>
</body>
</html>
