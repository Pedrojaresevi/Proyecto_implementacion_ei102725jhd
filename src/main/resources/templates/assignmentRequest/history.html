<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Historial de Solicitudes</title>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://ovicastello.org/wp-content/uploads/2020/08/cropped-LOGO_Mesa-de-trabajo-1.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/proyecte.css}"/>
</head>
<body>

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container pb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0 align-middle">
            <i class="bi bi-archive-fill me-2" style="font-size: 2rem; color: #0d9488; vertical-align: middle;"></i>Historial Completado
        </h1>
    </div>

    <hr class="mb-4 text-muted">

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle text-center">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Tipo de servicio</th>
                <th>Disponibilidad</th>
                <th>Localización</th>
                <th>Formación requerida</th>
                <th>Experiencia requerida</th>
                <th>Habilidades requeridas</th>
                <th>Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="assignmentRequest: ${assignmentRequests}">
                <td th:text="${assignmentRequest.request_Id}" class="fw-bold text-secondary"></td>
                <td th:text="${assignmentRequest.requestDate}"></td>
                <td th:text="${assignmentRequest.typeOfService}"></td>
                <td th:text="${assignmentRequest.requiredStartAvailability} + ' - ' + ${assignmentRequest.requiredEndAvailability}"></td>
                <td th:text="${assignmentRequest.serviceLocation}"></td>
                <td th:text="${assignmentRequest.requiredTraining}"></td>
                <td th:text="${assignmentRequest.requiredExperience}"></td>
                <td th:text="${assignmentRequest.requiredSkills}"></td>
                <td>
                    <span class="badge rounded-pill bg-info text-dark px-3 py-2">
                        completed
                    </span>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(assignmentRequests)}">
                <td colspan="9" class="text-muted p-4">
                    No tienes solicitudes completadas en el historial.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${totalPages > 1}" aria-label="Navegación de historial" class="mt-4">
        <ul class="pagination justify-content-center">

            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/assignmentRequest/history(page=${currentPage - 1})}">&laquo;</a>
            </li>

            <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" class="page-item" th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link" th:href="@{/assignmentRequest/history(page=${i})}" th:text="${i + 1}">1</a>
            </li>

            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/assignmentRequest/history(page=${currentPage + 1})}">&raquo;</a>
            </li>

        </ul>
    </nav>

    <div class="mt-3 d-flex gap-2">
        <a href="/assignmentRequest/list" class="btn btn-secondary">Volver</a>
    </div>
</main>
</body>
</html>
