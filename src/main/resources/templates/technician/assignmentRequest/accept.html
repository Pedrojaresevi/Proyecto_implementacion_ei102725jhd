<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Confirmar Solicitud</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-light mb-4 shadow-sm">
    <div th:replace="~{fragments/base :: navbar}"></div>
</nav>

<div class="container mt-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Confirmar Aceptación de Solicitud</h4>
        </div>
        <div class="card-body">
            <p>Estás a punto de aceptar la solicitud <strong th:text="${assignmentRequest.request_Id}"></strong>.</p>
            <div class="alert alert-info">
                <strong>Nota:</strong> Al aceptar, el sistema buscará automáticamente candidatos (PAP/PATI) compatibles con la ubicación (<strong><span th:text="${assignmentRequest.serviceLocation}"></span></strong>) y las habilidades requeridas.
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/assignmentRequest/list}" class="btn btn-secondary">Cancelar</a>
                <a th:href="@{/assignmentRequest/accept/execute/{id}(id=${assignmentRequest.request_Id})}"
                   class="btn btn-success">Confirmar</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
