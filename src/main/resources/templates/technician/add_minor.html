<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8" />
    <title>Añadir Menor a Cargo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/proyecte.css" th:href="@{/css/proyecte.css}"/>
</head>
<body>
<nav class="navbar navbar-light bg-light mb-4 shadow-sm">
    <div th:replace="~{fragments/base :: navbar}"></div>
</nav>

<main class="container">
    <h1 class="mb-4">Registrar y Vincular Menor (Alta Directa)</h1>
    <p class="text-muted">Al ser un registro realizado por un técnico, el usuario quedará en estado <b>Aceptado</b> automáticamente.</p>

    <form class="form-horizontal" th:action="@{/tutor/add-minor}" th:object="${oviUser}" method="post">

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="dni" class="form-label">DNI / ID del Menor:</label>
                <input id="dni" type="text" th:field="*{dni}" class="form-control" maxlength="9" placeholder="Ej: 12345678Z">
                <div th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}" class="text-danger small"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="name" class="form-label">Nombre Completo:</label>
                <input type="text" class="form-control" id="name" th:field="*{name}" maxlength="50" />
                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" maxlength="150" placeholder="correo@ejemplo.com"/>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="password" class="form-label">Contraseña inicial:</label>
                <input type="text" class="form-control" id="password" th:field="*{password}" maxlength="150"/>
                <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger small"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="dateOfBirth" class="form-label">Fecha de Nacimiento:</label>
                <input type="date" class="form-control" id="dateOfBirth" th:field="*{dateOfBirth}" />
                <div th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}" class="text-danger small"></div>
            </div>
            <div class="col-md-8 mb-3">
                <label for="address" class="form-label">Dirección:</label>
                <input type="text" class="form-control" id="address" th:field="*{address}" maxlength="200"/>
                <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-danger small"></div>
            </div>
        </div>

        <hr>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="typeOfFunctionalDiversity" class="form-label">Tipo de diversidad funcional:</label>
                <input type="text" class="form-control" id="typeOfFunctionalDiversity" th:field="*{typeOfFunctionalDiversity}" maxlength="150"/>
                <div th:if="${#fields.hasErrors('typeOfFunctionalDiversity')}" th:errors="*{typeOfFunctionalDiversity}" class="text-danger small"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="entityThatIsInvolved" class="form-label">Entidad involucrada:</label>
                <input type="text" class="form-control" id="entityThatIsInvolved" th:field="*{entityThatIsInvolved}" maxlength="150"/>
                <div th:if="${#fields.hasErrors('entityThatIsInvolved')}" th:errors="*{entityThatIsInvolved}" class="text-danger small"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8 mb-3">
                <label for="lifePlan" class="form-label">Plan de Vida:</label>
                <input type="text" class="form-control" id="lifePlan" th:field="*{lifePlan}" maxlength="150"/>
                <div th:if="${#fields.hasErrors('lifePlan')}" th:errors="*{lifePlan}" class="text-danger small"></div>
            </div>
            <div class="col-md-4 mb-3">
                <label for="tutor_id" class="form-label">DNI del Tutor Responsable:</label>
                <input type="text" class="form-control" id="tutor_id" th:field="*{tutor_id}" maxlength="9" placeholder="DNI del tutor"/>
                <div th:if="${#fields.hasErrors('tutor_id')}" th:errors="*{tutor_id}" class="text-danger small"></div>
            </div>
        </div>

        <input type="hidden" name="status" value="accepted" />
        <input type="hidden" name="dateOfAcceptance" th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" />

        <div class="mt-4">
            <button type="submit" class="btn btn-success">Registrar Menor</button>
            <a href="/dashboard" class="btn btn-secondary ms-2">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
