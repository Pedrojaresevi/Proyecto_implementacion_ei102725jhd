<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Tutores Rechazados</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/proyecte.css}"/>
</head>
<body>

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container pb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0 align-middle">
            <i class="bi bi-person-x me-2" style="font-size: 2rem; color: #dc3545; vertical-align: middle;"></i>Tutores Rechazados
        </h1>
    </div>

    <hr class="mb-4 text-muted">

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle text-center">
            <thead class="table-dark">
            <tr>
                <th>DNI</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Estado</th>
                <th>Motivo de Rechazo</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="tutor : ${tutors}">
                <td th:text="${tutor.dni}"></td>
                <td th:text="${tutor.name}"></td>
                <td th:text="${tutor.email}"></td>
                <td><span class="badge rounded-pill bg-danger px-3 py-2">Rechazado</span></td>
                <td>
                    <em class="text-danger fw-semibold" th:text="${tutor.rejectReason ?: 'No especificado'}"></em>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(tutors)}">
                <td colspan="5" class="text-center text-muted p-4">No hay tutores rechazados en el sistema.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${totalPages > 1}" aria-label="Navegación de tutores" class="mt-4">
        <ul class="pagination justify-content-center">

            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/tutor/refused(page=${currentPage - 1})}">&laquo;</a>
            </li>

            <li th:each="i : ${#numbers.sequence(1, totalPages)}" class="page-item" th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link" th:href="@{/tutor/refused(page=${i})}" th:text="${i}">1</a>
            </li>

            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/tutor/refused(page=${currentPage + 1})}">&raquo;</a>
            </li>

        </ul>
    </nav>
    <a href="/dashboard" class="btn btn-secondary mt-3">Volver</a>

</main>
</body>
</html>
