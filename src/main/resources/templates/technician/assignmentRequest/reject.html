<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Rechazar Solicitud</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/proyecte.css}"/>
</head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>

<div class="container mt-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-danger text-white">
            <h4 class="mb-0">Confirmar Rechazo de Solicitud</h4>
        </div>
        <div class="card-body">
            <p>Estás a punto de <strong>rechazar</strong> la solicitud con ID: <strong th:text="${assignmentRequest.request_Id}"></strong>.</p>

            <form th:action="@{/assignmentRequest/reject/execute/{id}(id=${assignmentRequest.request_Id})}" method="post">

                <div class="mb-3 mt-4">
                    <label for="rejectReason" class="form-label fw-bold text-danger">Motivo del rechazo (Obligatorio):</label>
                    <textarea class="form-control border-danger" id="rejectReason" name="rejectReason" rows="3"
                              placeholder="Escribe aquí por qué se rechaza esta solicitud..." required></textarea>
                </div>

                <div class="alert alert-warning">
                    <strong>Atención:</strong> Al rechazar, el estado cambiará a <em>"refused"</em> y no se buscarán candidatos.
                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a th:href="@{/assignmentRequest/list}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger">Confirmar Rechazo</button>
                </div>
            </form>
        </div>
        </div>
    </div>
</div>
</body>
</html>
