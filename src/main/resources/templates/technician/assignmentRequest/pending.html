<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Solicitudes de Asignación Pendientes</title>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://ovicastello.org/wp-content/uploads/2020/08/cropped-LOGO_Mesa-de-trabajo-1.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/proyecte.css}"/>
</head>
<body>

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container pb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0 align-middle">
            <i class="bi bi-clipboard-check me-2" style="font-size: 2rem; color: #0d9488; vertical-align: middle;"></i>Solicitudes Pendientes
        </h1>
    </div>

    <hr class="mb-4 text-muted">

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle text-center">
            <thead class="table-dark">
            <tr>
                <th>ID Petición</th>
                <th>Tipo de Servicio</th>
                <th>DNI Realizador</th>
                <th>Estado</th>
                <th class="text-center">Detalles</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="request : ${assignmentRequests}">
                <td th:text="${request.request_Id}"></td>
                <td th:text="${request.typeOfService}"></td>

                <td th:text="${request.oviuser_id != null ? request.oviuser_id : request.tutor_id}"></td>

                <td>
                    <span class="badge rounded-pill bg-warning text-dark px-3 py-2">In progress</span>
                </td>

                <td class="text-center">
                    <a th:href="@{/pap_pati/detallesasignacion/{id}(id=${request.request_Id}, from='pending')}"
                       class="btn btn-secondary btn-sm px-4 py-2 shadow-sm fw-semibold">
                        <i class="bi bi-eye-fill me-1"></i> Ver solicitud
                    </a>
                </td>

                <td class="text-center">
                    <div class="d-flex gap-1 justify-content-center">
                        <a th:href="@{/assignmentRequest/accept/{id}(id=${request.request_Id})}"
                           class="btn btn-success btn-sm">Aceptar</a>
                        <a th:href="@{/assignmentRequest/reject/{id}(id=${request.request_Id})}"
                           class="btn btn-danger btn-sm">Rechazar</a>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(assignmentRequests)}">
                <td colspan="6" class="text-center text-muted p-4">No hay solicitudes pendientes.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${totalPages > 1}" aria-label="Navegación de solicitudes pendientes" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/assignmentRequest/pending(page=${currentPage - 1})}">&laquo;</a>
            </li>
            <li th:each="i : ${#numbers.sequence(1, totalPages)}" class="page-item" th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link" th:href="@{/assignmentRequest/pending(page=${i})}" th:text="${i}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/assignmentRequest/pending(page=${currentPage + 1})}">&raquo;</a>
            </li>
        </ul>
    </nav>

    <a href="/dashboard" class="btn btn-secondary mt-3">Volver</a>
</main>
</body>
</html>
