<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8" />
    <title>Crear nuevo PAP/PATI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/proyecte.css"
          th:href="@{/css/proyecte.css}"/>
</head>
<body>
<nav class="navbar navbar-light bg-light mb-4 shadow-sm">
    <div th:replace="~{fragments/base :: navbar}"></div>
</nav>

<main class="container">
    <h1>Nuevo PAP/PATI</h1>
    <form class="form-horizontal" th:action="@{/pap_pati/add}" th:object="${pap_pati}" method="post">

        <div class="form-group row">
            <label for="dni" class="control-label col-sm-2">Dni: </label>
            <input id="dni" type="text" th:field="*{dni}" class="form-control col-sm-4" maxlength="9">
            <div th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="name" class="control-label col-sm-2">Nombre:</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" maxlength="50" />
            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"  class="error"></div>

        </div>

        <div class="form-group row">
            <label for="surname" class="control-label col-sm-2">Apellido:</label>
            <input type="text" class="form-control" id="surname" th:field="*{surname}" maxlength="50" />
            <div th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="dateOfBirth" class="control-label col-sm-2">Fecha de nacimiento:</label>
            <input type="date" class="form-control" id="dateOfBirth" th:field="*{dateOfBirth}" />
            <div th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="address" class="control-label col-sm-2">Dirección:</label>
            <input type="text" class="form-control" id="address" th:field="*{address}"  maxlength="150"/>
            <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}"  class="error"></div>
        </div>

        <div class="mb-3 col-md-4">
            <label for="phone" class="form-label">Teléfono:</label>
            <input id="phone" type="text" th:field="*{phone}" class="form-control" />
            <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="email" class="control-label col-sm-2">Email:</label>
            <input type="email" class="form-control" id="email" th:field="*{email}" maxlength="150"/>
            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="specificTraining" class="control-label col-sm-2">Formación Específica:</label>
            <input type="text" class="form-control" id="specificTraining" th:field="*{specificTraining}" maxlength="150"/>
            <div th:if="${#fields.hasErrors('specificTraining')}" th:errors="*{specificTraining}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="typeOfExperience" class="control-label col-sm-2">Tipo de Experiencia:</label>
            <input type="text" class="form-control" id="typeOfExperience" th:field="*{typeOfExperience}" maxlength="150"/>
            <div th:if="${#fields.hasErrors('typeOfExperience')}" th:errors="*{typeOfExperience}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="curriculumVitae" class="control-label col-sm-2">Currículum Vitae:</label>
            <input type="text" class="form-control" id="curriculumVitae" th:field="*{curriculumVitae}" maxlength="150"/>
            <div th:if="${#fields.hasErrors('curriculumVitae')}" th:errors="*{curriculumVitae}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="userAndPassword" class="control-label col-sm-2">Usuario y contraseña:</label>
            <input type="text" class="form-control" id="userAndPassword" th:field="*{userAndPassword}" maxlength="150"/>
            <div th:if="${#fields.hasErrors('userAndPassword')}" th:errors="*{userAndPassword}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="status" class="control-label col-sm-2">Estatus:</label>
            <select class="form-select" id="status" th:field="*{status}">
                <option value="">Selecciona un estatus</option>
                <option value="in progress">En progreso (in progress)</option>
                <option value="accepted">Aceptado (accepted)</option>
                <option value="refused">Rechazado (refused)</option>
            </select>
            <div th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="error"></div>
        </div>

        <div class="form-group row">
            <label for="startDate" class="control-label col-sm-2">Fecha de inicio:</label>
            <input type="date" class="form-control" id="startDate" th:field="*{startDate}" />
            <div th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="endDate" class="control-label col-sm-2">Fecha fin:</label>
            <input type="date" class="form-control" id="endDate" th:field="*{endDate}" />
            <div th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="geographicMobility" class="control-label col-sm-2">Mobilidad Geográfica:</label>
            <input type="text" class="form-control" id="geographicMobility" th:field="*{geographicMobility}" maxlength="150"/>
            <div th:if="${#fields.hasErrors('geographicMobility')}" th:errors="*{geographicMobility}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="skills" class="control-label col-sm-2">Habilidades:</label>
            <input type="text" class="form-control" id="skills" th:field="*{skills}" maxlength="150"/>
            <div th:if="${#fields.hasErrors('skills')}" th:errors="*{skills}"  class="error"></div>
        </div>

        <button type="submit" class="btn btn-primary">Añadir PAP/PATI</button>
        <br><br>
        <a href="/pap_pati/list" class="btn btn-secondary">Volver</a>
    </form>
</main>
</body>
</html>
