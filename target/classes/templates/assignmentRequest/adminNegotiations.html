<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Solicitudes en Negociación</title>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://ovicastello.org/wp-content/uploads/2020/08/cropped-LOGO_Mesa-de-trabajo-1.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/proyecte.css}"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-end mb-4">
        <h1 class="mb-0 align-middle">
            <i class="bi bi-chat-dots me-2" style="font-size: 2rem; color: #0d9488; vertical-align: middle;"></i>Solicitudes en Negociación
        </h1>
    </div>

    <hr class="mb-4 text-muted">

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle text-center">
            <thead class="table-dark">
            <tr>
                <th>ID Solicitud</th>
                <th>Usuario OVI</th>
                <th>Tipo Servicio</th>
                <th class="text-center">Detalles</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="req : ${requests}">
                <td th:text="${req.request_Id}"></td>
                <td th:text="${req.oviuser_id}"></td>
                <td th:text="${req.typeOfService}"></td>
                <td class="text-center">
                    <a th:href="@{/assignmentRequest/detail/{id}(id=${req.request_Id})}"
                       class="btn btn-secondary btn-sm px-4 py-2 shadow-sm fw-semibold">
                        <i class="bi bi-eye-fill me-1"></i> Ver solicitud
                    </a>
                </td>
                <td>
                    <th:block th:if="${firstNegotiationId.containsKey(req.request_Id)}">
                        <a th:href="@{/negotiation/chat/{id}(id=${firstNegotiationId.get(req.request_Id)}, readOnly=true)}"
                           class="btn btn-sm btn-primary px-3 shadow-sm">
                            <i class="bi bi-chat-text me-1"></i> Ver Conversación
                        </a>
                    </th:block>
                    <th:block th:unless="${firstNegotiationId.containsKey(req.request_Id)}">
                        <span class="text-muted small">Sin conversaciones</span>
                    </th:block>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(requests)}">
                <td colspan="4" class="text-center text-muted p-4">
                    <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                    <p class="mt-2">No hay solicitudes en negociación.</p>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-4">
        <a href="/dashboard" class="btn btn-secondary">Volver</a>
    </div>
</main>
</body>
</html>
