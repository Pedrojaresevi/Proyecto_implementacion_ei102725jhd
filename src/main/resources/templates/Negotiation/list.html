<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <title>Gestionar Negociaciones</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
</head>
<body>
<h1>Lista de Negociaciones</h1>
<table>
    <thead>
    <tr>
        <th>Request Id</th>
        <th>PAP/PATI Id</th>
        <th>Status</th>
        <th>Record of Comunications</th>
        <th>Start Date</th>
        <th>End Date</th>
        <td></td> <!-- no usar <th> quan no hi ha capçalera -->
        <td></td>
    </tr>
    </thead>
    <tbody>
    <tr th:each="negotiation: ${negotiations}">
        <td th:text="${negotiation.requestId}"></td>
        <td th:text="${negotiation.pap_patiId}"></td>
        <td th:text="${negotiation.status}"></td>
        <td th:text="${negotiation.recordOfComunications}"></td>
        <td th:text="${negotiation.startDate}"></td>
        <td th:text="${negotiation.endDate}"></td>


        <td><a th:href="@{/negotiation/update/{requestId}/{pap_patiId}(requestId=${negotiation.requestId}, pap_patiId=${negotiation.pap_patiId})}">Edita</a>
        </td>
        <td><a th:href="@{/negotiation/delete/{requestId}/{pap_patiId}(requestId=${negotiation.requestId}, pap_patiId=${negotiation.pap_patiId})}">Esborra</a>
        </td>
    </tr>
    </tbody>
</table>
<a href="add">Añadir Negociación</a>
<br><br>
<a href="/">Volver</a>
</body>
</html>
