<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8" />
    <title>Confirmar Rechazo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-light bg-light mb-4 shadow-sm">
    <div th:replace="~{fragments/base :: navbar}"></div>
</nav>
<div class="container mt-5">
    <div class="card border-danger">
        <div class="card-header bg-danger text-white">Confirmar Rechazo</div>
        <div class="card-body p-4">
            <h5>Rechazar a: <span th:text="${pap_pati.name} + ' ' + ${pap_pati.surname}"></span></h5>
            <form th:action="@{/pap_pati/reject/execute/{dni}(dni=${pap_pati.dni})}" method="post" class="mt-3">
                <div class="mb-3">
                    <label class="form-label">Motivo del rechazo:</label>
                    <textarea class="form-control" name="rejectReason" rows="3" required></textarea>
                </div>
                <button type="submit" class="btn btn-danger">Confirmar Rechazo</button>
                <a th:href="@{/pap_pati/list}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
