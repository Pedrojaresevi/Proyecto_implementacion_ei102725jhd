<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Confirmar Aceptación de candidato</title>
    <link rel="icon" href="https://ovicastello.org/wp-content/uploads/2020/08/cropped-LOGO_Mesa-de-trabajo-1.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/proyecte.css}"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/base :: navbar}"></div>

<div class="container mt-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Confirmar Aceptación de candidato</h4>
        </div>
        <div class="card-body">
            <p>Estás a punto de aceptar al candidato <strong th:text="${pappati.name}"></strong> con DNI <strong th:text="${pappati.dni}"></strong>.</p>

            <div class="d-flex justify-content-end gap-2">
                <form th:action="@{/assignmentRequest/finalizeAssignment}" method="post" class="m-0">
                    <input type="hidden" name="candidateId" th:value="${pappati.dni}" />
                    <input type="hidden" name="requestId" th:value="${requestId}" />
                    <button type="submit" class="btn btn-success">Confirmar Aceptación</button>
                </form>

                <a th:href="@{/assignmentRequest/proposals/{id}(id=${requestId})}" class="btn btn-secondary">Cancelar</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
