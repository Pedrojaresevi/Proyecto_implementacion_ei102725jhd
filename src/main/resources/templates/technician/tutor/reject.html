<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Confirmar Rechazo de Tutor</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" type="text/css" th:href="@{/css/proyecte.css}"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/base :: navbar}"></div>

<div class="container mt-5">
  <div class="card shadow-sm border-0">
    <div class="card-header bg-danger text-white">
      <h4 class="mb-0">Confirmar Rechazo de Tutor</h4>
    </div>
    <div class="card-body">
      <p>Estás a punto de <strong>rechazar</strong> al tutor <strong th:text="${tutor.name}"></strong> con DNI <strong th:text="${tutor.dni}"></strong>.</p>

      <div class="alert alert-warning">
        <strong>Atención:</strong> Al rechazar, el estado cambiará a <em>"refused"</em>.
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a th:href="@{/tutor/reject/execute/{dni}(dni=${tutor.dni})}" class="btn btn-danger">Confirmar Rechazo</a>
        <a th:href="@{/tutor/pending}" class="btn btn-secondary">Cancelar</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
