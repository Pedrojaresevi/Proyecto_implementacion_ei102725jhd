<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8" />
    <title>Crear nuevo Contrato</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <link rel="stylesheet" type="text/css" href="/css/proyecte.css"
          th:href="@{/css/proyecte.css}"/>
</head>
<body>

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container">
    <h1>Nuevo Contrato</h1>
    <form class="form-horizontal" th:action="@{/contract/add}" th:object="${contract}" method="post">



        <div class="form-group row">
            <label for="startDate" class="control-label col-sm-2">Fecha de inicio:</label>
            <input type="date" class="form-control" id="startDate" th:field="*{startDate}" required/>
            <div th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" class="text-danger"></div>
        </div>

        <div class="form-group row">
            <label for="endDate" class="control-label col-sm-2">Fecha fin:</label>
            <input type="date" class="form-control" id="endDate" th:field="*{endDate}" required/>
            <div th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}" class="text-danger"></div>
        </div>


        <div class="form-group row">
            <label for="request_Id" class="control-label col-sm-2">Id de la solicitud: </label>
            <input id="request_Id" type="text" th:field="*{request_Id}" class="form-control col-sm-4" maxlength="20" required>
            <div th:if="${#fields.hasErrors('request_Id')}" th:errors="*{request_Id}" class="text-danger"></div>
        </div>


        <div class="form-group row">
            <label for="pappati_id" class="control-label col-sm-2">ID del PAP/PATI:</label>
            <input type="text" class="form-control" id="pappati_id" th:field="*{pappati_id}" maxlength="9" required />
            <div th:if="${#fields.hasErrors('pappati_id')}" th:errors="*{pappati_id}" class="text-danger"></div>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Añadir contrato</button>
        <a th:href="@{/contract/user/{dni}(dni=${user.dni})}" class="btn btn-secondary mt-3 ms-2">Volver</a>
    </form>
</main>
</body>
</html>
