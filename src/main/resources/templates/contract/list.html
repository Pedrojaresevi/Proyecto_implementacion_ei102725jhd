<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <title>Gestionar Contratos</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="/css/proyecte.css" th:href="@{/css/proyecte.css}"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-light mb-4 shadow-sm">
    <div th:replace="~{fragments/base :: navbar}"></div>
</nav>

<main class="container mt-4">
    <h1 class="mb-4 text-primary">Lista de Contratos</h1>

    <div class="mb-3">
        <a th:href="@{/contract/add}" class="btn btn-primary">➕ Añadir Contrato</a>
    </div>

    <div class="table-responsive shadow-sm rounded">
        <table class="table table-striped table-hover align-middle mb-0 bg-white">
            <thead class="table-dark">
            <tr>
                <th>Contract Id</th>
                <th>Request Id</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Status</th>
                <th>Lugar PDF</th>
                <th>PAP/PATI Id</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="contract: ${contracts}">
                <td th:text="${contract.contract_Id}"></td>
                <td th:text="${contract.request_Id}"></td>
                <td th:text="${contract.startDate}"></td>
                <td th:text="${contract.endDate}"></td>
                <td>
                    <span th:class="${contract.status == 'accepted' ? 'badge bg-success' : 'badge bg-warning text-dark'}"
                          th:text="${contract.status}"></span>
                </td>
                <td th:text="${contract.placeWhereThePDFIsGonnaBeSaved}"></td>
                <td th:text="${contract.pappati_id}"></td>

                <td class="text-center">
                    <div class="d-flex justify-content-center gap-2">
                        <a th:href="@{/contract/update/{contract_Id}(contract_Id=${contract.contract_Id})}" class="btn btn-warning btn-sm">Edita</a>
                        <a th:href="@{/contract/delete/{contract_Id}(contract_Id=${contract.contract_Id})}" class="btn btn-danger btn-sm">Esborra</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-4">
        <a href="/dashboard" class="btn btn-secondary">Volver al Dashboard</a>
    </div>
</main>
</body>
</html>
