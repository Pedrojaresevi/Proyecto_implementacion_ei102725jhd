<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <title>Mis Propuestas de Servicio</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/proyecte.css}"/>
</head>
<body>

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container mt-4">
    <header class="mb-4">
        <h1>Mis Propuestas de Servicio</h1>
        <p class="lead">Estas son las solicitudes donde has sido seleccionado como candidato.</p>
    </header>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID Solicitud</th>
                <th>Fecha Solicitud</th>
                <th>Tipo de Servicio</th>
                <th>Ubicación</th>
                <th>Estado</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="request: ${assignmentRequests}">
                <td th:text="${request.request_Id}" class="fw-bold"></td>
                <td th:text="${#dates.format(request.requestDate, 'dd/MM/yyyy')}"></td>
                <td th:text="${request.typeOfService}"></td>
                <td th:text="${request.serviceLocation}"></td>

                <td>
                    <span th:text="${request.status}"
                          th:class="${request.status == 'in progress' ? 'badge bg-warning text-dark' : 'badge bg-success'}">
                    </span>
                </td>

                <td class="text-center">
                    <a th:href="@{/pap_pati/detallesasignacion/{id}(id=${request.request_Id})}" class="btn btn-outline-primary">
                        <i class="bi bi-search"></i> Consultar asignación
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(assignmentRequests)}">
                <td colspan="6" class="text-center text-muted p-4">
                    Actualmente no tienes propuestas de servicios asignadas.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-3">
        <a href="/dashboard" class="btn btn-secondary">Volver</a>
    </div>
</main>
</body>
</html>
