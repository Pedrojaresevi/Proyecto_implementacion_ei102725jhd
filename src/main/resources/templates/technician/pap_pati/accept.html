<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Confirmar Aceptación</title>
    <link rel="icon" href="https://ovicastello.org/wp-content/uploads/2020/08/cropped-LOGO_Mesa-de-trabajo-1.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/proyecte.css}"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/base :: navbar}"></div>

<div class="container mt-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Confirmar Aceptación de PAP/PATI</h4>
        </div>
        <div class="card-body">
            <p>Estás a punto de aceptar al PAP/PATI <strong th:text="${pap_pati.name} + ' ' + ${pap_pati.surname}"></strong> con DNI <strong th:text="${pap_pati.dni}"></strong>.</p>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/pap_pati/accept/execute/{dni}(dni=${pap_pati.dni})}" class="btn btn-success">Confirmar Aceptación</a>
                <a th:href="@{/pap_pati/pending}" class="btn btn-secondary">Cancelar</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
