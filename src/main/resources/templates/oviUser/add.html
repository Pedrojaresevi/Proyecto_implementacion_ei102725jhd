<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8" />
    <title>Crear nuevo OviUser</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/proyecte.css"
          th:href="@{/css/proyecte.css}"/>
</head>
<body>
<nav class="navbar navbar-light bg-light mb-4 shadow-sm">
    <div th:replace="~{fragments/base :: navbar}"></div>
</nav>

<main class="container">
    <h1>Nuevo OviUser</h1>
    <form class="form-horizontal" th:action="@{/oviUser/add}" th:object="${oviUser}" method="post">

        <div class="form-group row">
            <label for="dni" class="control-label col-sm-2">Id: </label>
            <input id="dni" type="text" th:field="*{dni}" class="form-control col-sm-4" maxlength="9">
            <div th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="name" class="control-label col-sm-2">Nombre:</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" maxlength="50" />
            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"  class="error"></div>

        </div>

        <div class="form-group row">
            <label for="address" class="control-label col-sm-2">Dirección:</label>
            <input type="text" class="form-control" id="address" th:field="*{address}"  maxlength="200"/>
            <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="email" class="control-label col-sm-2">Email:</label>
            <input type="email" class="form-control" id="email" th:field="*{email}" maxlength="150"/>
            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="entityThatIsInvolved" class="control-label col-sm-2">Entidad en la que está involucrado:</label>
            <input type="text" class="form-control" id="entityThatIsInvolved" th:field="*{entityThatIsInvolved}" maxlength="150"/>
            <div th:if="${#fields.hasErrors('entityThatIsInvolved')}" th:errors="*{entityThatIsInvolved}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="typeOfFunctionalDiversity" class="control-label col-sm-2">Tipo de diversidad funcional:</label>
            <input type="text" class="form-control" id="typeOfFunctionalDiversity" th:field="*{typeOfFunctionalDiversity}" maxlength="150"/>
            <div th:if="${#fields.hasErrors('typeOfFunctionalDiversity')}" th:errors="*{typeOfFunctionalDiversity}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="dateOfAcceptance" class="control-label col-sm-2">Fecha de aceptación:</label>
            <input type="date" class="form-control" id="dateOfAcceptance" th:field="*{dateOfAcceptance}" />
            <div th:if="${#fields.hasErrors('dateOfAcceptance')}" th:errors="*{dateOfAcceptance}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="userAndPassword" class="control-label col-sm-2">Usuario y contraseña:</label>
            <input type="text" class="form-control" id="userAndPassword" th:field="*{userAndPassword}" maxlength="150"/>
            <div th:if="${#fields.hasErrors('userAndPassword')}" th:errors="*{userAndPassword}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="status" class="control-label col-sm-2">Estatus:</label>
            <select class="form-select" id="status" th:field="*{status}">
                <option value="">Selecciona un estatus</option>
                <option value="in progress">En progreso (in progress)</option>
                <option value="accepted">Aceptado (accepted)</option>
                <option value="refused">Rechazado (refused)</option>
            </select>
            <div th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="error"></div>
        </div>

        <div class="form-group row">
            <label for="lifePlan" class="control-label col-sm-2">Life Plan:</label>
            <input type="text" class="form-control" id="lifePlan" th:field="*{lifePlan}" maxlength="150"/>
            <div th:if="${#fields.hasErrors('lifePlan')}" th:errors="*{lifePlan}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="tutor_id" class="control-label col-sm-2">Id tutor:</label>
            <input type="text" class="form-control" id="tutor_id" th:field="*{tutor_id}" maxlength="9"/>
            <div th:if="${#fields.hasErrors('tutor_id')}" th:errors="*{tutor_id}"  class="error"></div>
        </div>

        <button type="submit" class="btn btn-primary">Añadir usuario</button>
        <br><br>
        <a href="/oviUser/list" class="btn btn-secondary">Volver</a>
    </form>
</main>
</body>
</html>
