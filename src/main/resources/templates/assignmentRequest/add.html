<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
  <meta charset="UTF-8" />
  <title>Crear una Asigment Request - oviuser</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="/css/proyecte.css"
        th:href="@{/css/proyecte.css}"/>
</head>
<body>
<nav class="navbar navbar-light bg-light mb-4 shadow-sm">
  <div th:replace="~{fragments/base :: navbar}"></div>
</nav>

<main class="container">
  <h1>Nuevo Asigment Request</h1>
  <form class="form-horizontal" th:action="@{/assignmentRequest/add}" th:object="${assignmentRequest}" method="post">

    <div class="form-group row">
      <label for="typeOfService" class="control-label col-sm-2">Tipo de Servicio:</label>
      <input type="text" class="form-control" id="typeOfService" th:field="*{typeOfService}" maxlength="150" />
      <div th:if="${#fields.hasErrors('typeOfService')}" th:errors="*{typeOfService}"  class="error"></div>

    </div>

    <div class="form-group row">
      <label for="requiredStartAvailability" class="control-label col-sm-2">Fecha de inicio del servicio:</label>
      <input type="date" class="form-control" id="requiredStartAvailability" th:field="*{requiredStartAvailability}"/>
      <div th:if="${#fields.hasErrors('requiredStartAvailability')}" th:errors="*{requiredStartAvailability}"  class="error"></div>
    </div>

    <div class="form-group row">
      <label for="requiredEndAvailability" class="control-label col-sm-2">Fecha de fin del servicio:</label>
      <input type="date" class="form-control" id="requiredEndAvailability" th:field="*{requiredEndAvailability}"/>
      <div th:if="${#fields.hasErrors('requiredEndAvailability')}" th:errors="*{requiredEndAvailability}"  class="error"></div>
    </div>

    <div class="form-group row">
      <label for="serviceLocation" class="control-label col-sm-2">Ubicación:</label>
      <select class="form-select" id="serviceLocation" th:field="*{serviceLocation}">
        <option value="">Selecciona una provincia...</option>
        <option th:each="provincia : ${provincias}"
                th:value="${provincia}"
                th:text="${provincia}"></option>
      </select>
      <div th:if="${#fields.hasErrors('serviceLocation')}" th:errors="*{serviceLocation}" class="error"></div>
    </div>

    <div class="form-group row">
      <label for="requiredTraining" class="control-label col-sm-2">Formación requerida:</label>
      <input type="text" class="form-control" id="requiredTraining" th:field="*{requiredTraining}" maxlength="150"/>
      <div th:if="${#fields.hasErrors('requiredTraining')}" th:errors="*{requiredTraining}"  class="error"></div>
    </div>

    <div class="form-group row">
      <label for="serviceLocation" class="control-label col-sm-2">Experiencia necesaria:</label>
      <select class="form-select" id="requiredExperience" th:field="*{requiredExperience}">
        <option value="">Seleccione cuántos años de experiencia...</option>
        <option th:each="anyo : ${anyosExperiencia}"
                th:value="${anyo}"
                th:text="${anyo}"></option>
      </select>
      <div th:if="${#fields.hasErrors('requiredExperience')}" th:errors="*{requiredExperience}" class="error"></div>
    </div>

    <div class="form-group row">
      <label class="control-label col-sm-12">Habilidades requeridas:</label>

      <div class="ms-4">
        <div th:each="skill : ${skillsDisponibles}" class="form-check">
          <input class="form-check-input" type="checkbox" th:field="*{requiredSkills}" th:value="${skill}">
          <label class="form-check-label fw-normal" th:for="${#ids.prev('requiredSkills')}" th:text="${skill}"></label>
        </div>
      </div>

      <div th:if="${#fields.hasErrors('requiredSkills')}" th:errors="*{requiredSkills}" class="error"></div>
    </div>

    <button type="submit" class="btn btn-primary">Registrar Solicitud</button>
    <br><br>
    <a href="/" class="btn btn-secondary">Volver</a>
  </form>
</main>
</body>
</html>
