<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <title>Confirmar Solicitud</title>
    <link rel="icon" href="https://ovicastello.org/wp-content/uploads/2020/08/cropped-LOGO_Mesa-de-trabajo-1.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="/css/proyecte.css" th:href="@{/css/proyecte.css}"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/base :: navbar}"></div>

<div class="container mt-5">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Confirmar Aceptación de Solicitud</h4>
        </div>
        <div class="card-body">
            <p>Estás a punto de aceptar la solicitud <strong th:text="${assignmentRequest.request_Id}"></strong>.</p>
            <div class="alert alert-info">
                <strong>Nota:</strong> Al aceptar, el sistema buscará automáticamente candidatos (PAP/PATI) compatibles con la ubicación (<strong><span th:text="${assignmentRequest.serviceLocation}"></span></strong>) y las habilidades requeridas.
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/assignmentRequest/accept/execute/{id}(id=${assignmentRequest.request_Id})}"
                   class="btn btn-success">Confirmar</a>
                <a th:href="@{/assignmentRequest/pending}" class="btn btn-secondary">Cancelar</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
