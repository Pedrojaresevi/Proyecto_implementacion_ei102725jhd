<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Crear nueva Negociación - OVI</title>
    <link rel="icon" href="https://ovicastello.org/wp-content/uploads/2020/08/cropped-LOGO_Mesa-de-trabajo-1.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="/css/proyecte.css" th:href="@{/css/proyecte.css}"/>
</head>
<body>

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container pb-5">

    <h1 class="mb-0 align-middle">
        <i class="bi bi-chat-square-dots-fill me-2" style="font-size: 2rem; color: #0d9488; vertical-align: middle;"></i>Nueva Negociación
    </h1>
    <p class="text-muted mb-4">Complete los datos para iniciar o registrar el proceso de negociación entre el usuario y el asistente.</p>

    <hr class="mb-4 text-muted">

    <form class="form-horizontal" th:action="@{/negotiation/add}" th:object="${negotiation}" method="post">

        <h5 class="text-primary text-opacity-75 mb-3 fw-bold">1. Información de la Negociación</h5>

        <div class="form-group row mb-3">
            <label for="recordOfComunications" class="control-label col-sm-2">Registro de comunicaciones:</label>
            <div class="col-sm-10">
                <textarea class="form-control" id="recordOfComunications" th:field="*{recordOfComunications}" maxlength="150" rows="2" placeholder="Resumen de llamadas, correos..."></textarea>
                <div th:if="${#fields.hasErrors('recordOfComunications')}" th:errors="*{recordOfComunications}" class="text-danger mt-1"></div>
            </div>
        </div>

        <hr class="mb-4 text-muted">

        <h5 class="text-primary text-opacity-75 mb-3 fw-bold">2. Fechas y Vinculación</h5>

        <div class="form-group row mb-3">
            <label for="startDate" class="control-label col-sm-2">Fecha de inicio:</label>
            <div class="col-sm-4">
                <input type="date" class="form-control" id="startDate" th:field="*{startDate}" />
                <div th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}" class="text-danger mt-1"></div>
            </div>
        </div>

        <div class="form-group row mb-3">
            <label for="endDate" class="control-label col-sm-2">Fecha de fin:</label>
            <div class="col-sm-4">
                <input type="date" class="form-control" id="endDate" th:field="*{endDate}" />
                <div th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}" class="text-danger mt-1"></div>
            </div>
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Añadir Negociación</button>
            <a th:href="@{'/negotiation/user/' + ${user.dni}}" class="btn btn-secondary ms-2">Volver</a>
        </div>
    </form>
</main>
</body>
</html>
