<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8" />
    <title>Crear nuevo Contrato</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/proyecte.css"
          th:href="@{/css/proyecte.css}"/>
</head>
<body>
<main class="container">
    <h1>Nuevo Contrato</h1>
    <form class="form-horizontal" th:action="@{/contract/add}" th:object="${contract}" method="post">

        <div class="form-group row">
            <label for="contractId" class="control-label col-sm-2">Id del Contrato: </label>
            <input id="contractId" type="text" th:field="*{contractId}" class="form-control col-sm-4" maxlength="20">
            <div th:if="${#fields.hasErrors('contractId')}" th:errors="*{contractId}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="startDate" class="control-label col-sm-2">Fecha de inicio:</label>
            <input type="date" class="form-control" id="startDate" th:field="*{startDate}" required/>
            <div th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="endDate" class="control-label col-sm-2">Fecha fin:</label>
            <input type="date" class="form-control" id="endDate" th:field="*{endDate}" required/>
            <div th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="status" class="control-label col-sm-2">Estatus:</label>
            <select class="form-select" id="status" th:field="*{status}" >
                <option value="">Selecciona un estatus</option>
                <option value="in progress">En progreso (in progress)</option>
                <option value="accepted">Aceptado (accepted)</option>
                <option value="refused">Rechazado (refused)</option>
            </select>
            <div th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="error"></div>
        </div>

        <div class="form-group row">
            <label for="placeWhereThePDFisGonnaBeSaved" class="control-label col-sm-2">Lugar dónde el PDF será guardado:</label>
            <input type="text" class="form-control" id="placeWhereThePDFisGonnaBeSaved" th:field="*{placeWhereThePDFisGonnaBeSaved}" maxlength="150" required />
            <div th:if="${#fields.hasErrors('placeWhereThePDFisGonnaBeSaved')}" th:errors="*{placeWhereThePDFisGonnaBeSaved}"  class="error"></div>

        </div>

        <div class="form-group row">
            <label for="requestId" class="control-label col-sm-2">Id de la solicitud: </label>
            <input id="requestId" type="text" th:field="*{requestId}" class="form-control col-sm-4" maxlength="20" required>
            <div th:if="${#fields.hasErrors('requestId')}" th:errors="*{requestId}"  class="error"></div>
        </div>


        <div class="form-group row">
            <label for="pap_patiID" class="control-label col-sm-2">ID del PAP/PATI:</label>
            <input type="text" class="form-control" id="pap_patiID" th:field="*{pap_patiID}" maxlength="9" required />
            <div th:if="${#fields.hasErrors('pap_patiID')}" th:errors="*{pap_patiID}" class="error"></div>
        </div>

        <button type="submit" class="btn btn-primary">Añadir Contrato</button>
        <br><br>
        <a href="/" class="btn btn-secondary">Volver</a>
    </form>
</main>
</body>
</html>
