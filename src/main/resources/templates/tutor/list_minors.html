<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Personas a cargo</title>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://ovicastello.org/wp-content/uploads/2020/08/cropped-LOGO_Mesa-de-trabajo-1.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/proyecte.css}"/>
</head>
<body>

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container pb-5 mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0 align-middle">
            <i class="bi bi-person-lines-fill me-2" style="font-size: 2rem; color: #0d9488; vertical-align: middle;"></i> Usuarios a su cargo
        </h1>
    </div>

    <p class="text-muted">DNI del Tutor: <strong th:text="${tutor.dni}"></strong></p>

    <hr class="mb-4 text-muted">

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle text-center">
            <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Estado</th>
                <th class="text-center">Detalles</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user: ${oviUsers}">
                <td th:text="${user.name}"></td>
                <td th:text="${user.email}"></td>
                <td>
                    <span th:text="${user.status}"
                          th:class="${user.status == 'in progress' ? 'badge rounded-pill bg-warning text-dark px-3 py-2' :
                                   (user.status == 'accepted' or user.status == 'active' ? 'badge rounded-pill bg-success px-3 py-2' : 'badge rounded-pill bg-secondary px-3 py-2')}">
                    </span>
                </td>
                <td class="text-center">
                    <a th:href="@{/oviUser/masdetalle/{id}(id=${user.dni}, from='list_minors', tutorDni=${tutor.dni})}"
                       class="btn btn-secondary btn-sm px-4 py-2 shadow-sm fw-semibold">
                        <i class="bi bi-eye-fill me-1"></i> Ver perfil
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(oviUsers)}">
                <td colspan="4" class="text-center text-muted p-4">Este tutor no tiene actualmente ninguna persona a su cargo.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${totalPages > 1}" aria-label="Navegación de personas a cargo" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/tutor/users/{dni}(dni=${tutor.dni}, page=${currentPage - 1})}">&laquo;</a>
            </li>
            <li th:each="i : ${#numbers.sequence(1, totalPages)}" class="page-item" th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link" th:href="@{/tutor/users/{dni}(dni=${tutor.dni}, page=${i})}" th:text="${i}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/tutor/users/{dni}(dni=${tutor.dni}, page=${currentPage + 1})}">&raquo;</a>
            </li>
        </ul>
    </nav>

    <a th:href="@{/dashboard}" class="btn btn-secondary mt-3">Volver</a>

</main>
</body>
</html>
