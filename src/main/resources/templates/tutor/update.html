<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8" />
    <title>Modificar Negociación</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/proyecte.css" th:href="@{/css/proyecte.css}"/>
</head>
<body>
<main class="container">
    <h1>Modificar Negociación</h1>
    <form class="form-horizontal" th:action="@{/negotiation/update}" th:object="${negotiation}" method="post">

        <div class="form-group row mb-2">
            <label for="negotiation_Id" class="control-label col-sm-2">Id de la Negociación: </label>
            <input id="negotiation_Id" type="text" th:field="*{negotiation_Id}" class="form-control col-sm-4" readonly="readonly">
            <div th:if="${#fields.hasErrors('negotiation_Id')}" th:errors="*{negotiation_Id}"  class="error text-danger"></div>
        </div>

        <div class="form-group row mb-2">
            <label for="list_id" class="control-label col-sm-2">ID de la Lista:</label>
            <input type="text" class="form-control" id="list_id" th:field="*{list_id}" maxlength="20" required />
            <div th:if="${#fields.hasErrors('list_id')}" th:errors="*{list_id}" class="error text-danger"></div>
        </div>

        <div class="form-group row mb-2">
            <label for="status" class="control-label col-sm-2">Estatus:</label>
            <select class="form-select" id="status" th:field="*{status}">
                <option value="">Selecciona un estatus</option>
                <option th:each="estado : ${statusList}" th:value="${estado}" th:text="${estado}"></option>
            </select>
            <div th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="error text-danger"></div>
        </div>

        <div class="form-group row mb-2">
            <label for="recordOfComunications" class="control-label col-sm-2">Registro de Comunicaciones:</label>
            <input type="text" class="form-control" id="recordOfComunications" th:field="*{recordOfComunications}" maxlength="150" />
            <div th:if="${#fields.hasErrors('recordOfComunications')}" th:errors="*{recordOfComunications}"  class="error text-danger"></div>
        </div>

        <div class="form-group row mb-2">
            <label for="startDate" class="control-label col-sm-2">Fecha de inicio:</label>
            <input type="date" class="form-control" id="startDate" th:field="*{startDate}" />
            <div th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"  class="error text-danger"></div>
        </div>

        <div class="form-group row mb-2">
            <label for="endDate" class="control-label col-sm-2">Fecha fin:</label>
            <input type="date" class="form-control" id="endDate" th:field="*{endDate}" />
            <div th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"  class="error text-danger"></div>
        </div>

        <button type="submit" class="btn btn-warning mt-3">Guardar cambios</button>
        <br><br>
        <a href="/" class="btn btn-secondary">Volver</a>
    </form>
</main>
</body>
</html>
