<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8" />
    <title>Crear nueva Negociación</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/proyecte.css"
          th:href="@{/css/proyecte.css}"/>
</head>
<body>
<nav class="navbar navbar-light bg-light mb-4 shadow-sm">
    <div th:replace="~{fragments/base :: navbar}"></div>
</nav>

<main class="container">
    <h1>Nueva Negociación</h1>
    <form class="form-horizontal" th:action="@{/negotiation/add}" th:object="${negotiation}" method="post">

        <div class="form-group row">
            <label for="negotiation_Id" class="control-label col-sm-2">Id de la Negociación: </label>
            <input id="negotiation_Id" type="text" th:field="*{negotiation_Id}" class="form-control col-sm-4" maxlength="20">
            <div th:if="${#fields.hasErrors('negotiation_Id')}" th:errors="*{negotiation_Id}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="status" class="control-label col-sm-2">Estatus:</label>
            <select class="form-select" id="status" th:field="*{status}">
                <option value="">Selecciona un estatus</option>
                <option value="in progress">En progreso (in progress)</option>
                <option value="accepted">Aceptado (accepted)</option>
                <option value="refused">Rechazado (refused)</option>
            </select>
            <div th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="error"></div>
        </div>

        <div class="form-group row">
            <label for="recordOfComunications" class="control-label col-sm-2">Registro de Comunicaciones:</label>
            <input type="text" class="form-control" id="recordOfComunications" th:field="*{recordOfComunications}" maxlength="150" />
            <div th:if="${#fields.hasErrors('recordOfComunications')}" th:errors="*{recordOfComunications}"  class="error"></div>

        </div>

        <div class="form-group row">
            <label for="startDate" class="control-label col-sm-2">Fecha de inicio:</label>
            <input type="date" class="form-control" id="startDate" th:field="*{startDate}" />
            <div th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="endDate" class="control-label col-sm-2">Fecha fin:</label>
            <input type="date" class="form-control" id="endDate" th:field="*{endDate}" />
            <div th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"  class="error"></div>
        </div>

        <div class="form-group row">
            <label for="list_id" class="control-label col-sm-2">ID de la Lista:</label>
            <input type="text" class="form-control" id="list_id" th:field="*{listId}" maxlength="20" required />
            <div th:if="${#fields.hasErrors('listId')}" th:errors="*{listId}" class="error"></div>
        </div>

        <button type="submit" class="btn btn-primary">Añadir Negociación</button>
        <br><br>
        <a href="/" class="btn btn-secondary">Volver</a>
    </form>
</main>
</body>
</html>
