<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <title>Gestionar Contratos</title>
    <meta charset="UTF-8" />
    <link rel="icon" href="https://ovicastello.org/wp-content/uploads/2020/08/cropped-LOGO_Mesa-de-trabajo-1.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="/css/proyecte.css" th:href="@{/css/proyecte.css}"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0 align-middle">
            <i class="bi bi-file-earmark-text" style="font-size: 2rem; color: #0d9488; vertical-align: middle;"></i> Mis contratos
        </h1>
    </div>

    <hr class="mb-4 text-muted">

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle text-center">
            <thead class="table-dark">
            <tr>
                <th>Contract Id</th>
                <th>Request Id</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Status</th>
                <th>Lugar PDF</th>
                <th>PAP/PATI Id</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="contract: ${contracts}">
                <td th:text="${contract.contract_Id}"></td>
                <td th:text="${contract.request_Id}"></td>
                <td th:text="${#dates.format(contract.startDate, 'dd/MM/yyyy')}"></td>
                <td th:text="${#dates.format(contract.endDate, 'dd/MM/yyyy')}"></td>
                <td>
                    <span th:text="${contract.status}"
                          th:class="${contract.status == 'in progress' or contract.status == 'In progress' ? 'badge rounded-pill bg-warning text-dark px-3 py-2' :
                                   (contract.status == 'accepted' or contract.status == 'signed' or contract.status == 'completed' ? 'badge rounded-pill bg-success px-3 py-2' : 'badge rounded-pill bg-danger px-3 py-2')}">
                    </span>
                </td>
                <td th:text="${contract.placeWhereThePDFIsGonnaBeSaved}"></td>
                <td th:text="${contract.pappati_id}"></td>

                <td class="text-center">
                    <div class="d-flex justify-content-center gap-2">
                        <a th:if="${!isMinor}" th:href="@{/contract/update/{contract_Id}(contract_Id=${contract.contract_Id})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:if="${!isMinor}" th:href="@{/contract/delete/{contract_Id}(contract_Id=${contract.contract_Id})}" class="btn btn-danger btn-sm">Eliminar</a>

                        <span th:if="${isMinor}" class="text-muted small">
                            <i class="bi bi-lock-fill"></i> Solo lectura
                        </span>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(contracts)}">
                <td colspan="8" class="text-center text-muted p-4">No hay contratos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${totalPages > 1}" aria-label="Navegación de contratos" class="mt-5">
        <ul class="pagination justify-content-center">

            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/contract/list(page=${currentPage - 1})}" aria-label="Anterior">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <li th:each="i : ${#numbers.sequence(1, totalPages)}" class="page-item" th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link" th:href="@{/contract/list(page=${i})}" th:text="${i}">1</a>
            </li>

            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/contract/list(page=${currentPage + 1})}" aria-label="Siguiente">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>

        </ul>
    </nav>

    <div class="mt-4">
        <a href="/dashboard" class="btn btn-secondary">Volver</a>
    </div>
</main>
</body>
</html>
