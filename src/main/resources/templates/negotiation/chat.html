<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Chat de Negociación</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="/css/proyecte.css" th:href="@{/css/proyecte.css}"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container mt-2" style="max-width: 800px;">

    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex align-items-center py-3">
            <a th:href="@{/assignmentRequest/list}" class="text-white me-3 fs-4">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div class="rounded-circle bg-light text-primary d-flex justify-content-center align-items-center me-3" style="width: 45px; height: 45px; font-size: 1.2rem;">
                <span th:text="${#strings.substring(negotiationId, 0, 5)}">NEG</span>
            </div>

            <div>
                <h5 class="mb-0 fw-bold" th:text="'Negociación #' + ${negotiationId}">Chat</h5>
                <small th:text="'Estado: ' + ${status}">Estado</small>
            </div>
        </div>

        <div class="card-body chat-bg chat-window" id="chatBox" style="max-height: 450px; overflow-y: auto;">

            <div class="bubble bubble-system mb-3 p-3 bg-secondary-subtle rounded border-start border-primary border-3">
                <small class="text-primary fw-bold d-block mb-1">Sistema OVI</small>
                Bienvenido al chat de negociación. Utiliza este espacio para acordar las condiciones del contrato (horarios, lugar, etc.).
                <div class="time-stamp text-muted text-end" style="font-size: 0.75rem;">Automático</div>
            </div>

            <div th:each="msg : ${messages}" class="bubble mb-3 p-3 rounded bg-white border shadow-sm">
                <small class="text-secondary fw-bold d-block mb-1">Mensaje registrado:</small>
                <p class="mb-1 text-dark" th:text="${msg.recordOfComunications}">Texto del mensaje</p>
                <div class="time-stamp text-end text-muted fw-light" style="font-size: 0.75rem;">
                    <i class="bi bi-clock me-1"></i><span th:text="${msg.hora}">12:34</span>
                </div>
            </div>

        </div>

        <div class="card-footer bg-light p-3">
            <form th:action="@{/negotiation/sendMessage}" method="post" class="d-flex gap-2">

                <input type="hidden" name="negotiationId" th:value="${negotiationId}">
                <input type="hidden" name="listId" th:value="${listId}">

                <input type="text" name="messageText" class="form-control rounded-pill px-4"
                       placeholder="Escribe tu propuesta o mensaje aquí..." required autocomplete="off">

                <button class="btn btn-primary rounded-circle d-flex align-items-center justify-content-center"
                        type="submit" style="width: 45px; height: 45px;">
                    <i class="bi bi-send-fill text-white"></i>
                </button>
            </form>
        </div>
    </div>

</main>

</body>
</html>
