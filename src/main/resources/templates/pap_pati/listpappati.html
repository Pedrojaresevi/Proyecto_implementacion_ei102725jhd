<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <title>Mis Propuestas de Servicio</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/proyecte.css}"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container mt-4 pb-5">
    <header class="mb-4">
        <h1>Mis Propuestas de Servicio</h1>
        <p class="lead">Estas son las solicitudes donde has sido seleccionado como candidato.</p>
    </header>

    <div class="table-responsive shadow-sm rounded bg-white">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th>ID Solicitud</th>
                <th>Fecha Solicitud</th>
                <th>Tipo de Servicio</th>
                <th>Ubicación</th>
                <th>Estado</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="request: ${assignmentRequests}">
                <td th:text="${request.request_Id}" class="fw-bold"></td>
                <td th:text="${#dates.format(request.requestDate, 'dd/MM/yyyy')}"></td>
                <td th:text="${request.typeOfService}"></td>
                <td th:text="${request.serviceLocation}"></td>

                <td>
                    <span th:text="${request.status}"
                          th:class="${request.status == 'in progress' ? 'badge bg-warning text-dark px-3 py-2' : 'badge bg-success px-3 py-2'}">
                    </span>
                </td>

                <td class="text-center">
                    <a th:href="@{/pap_pati/detallesasignacion/{id}(id=${request.request_Id})}" class="btn btn-outline-primary btn-sm px-3">
                        <i class="bi bi-search me-1"></i> Consultar asignación
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(assignmentRequests)}">
                <td colspan="6" class="text-center text-muted p-4">
                    Actualmente no tienes propuestas de servicios asignadas.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${totalPages > 1}" aria-label="Navegación de propuestas" class="mt-4">
        <ul class="pagination justify-content-center">

            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/pap_pati/listpappati(page=${currentPage - 1})}" aria-label="Anterior">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <li th:each="i : ${#numbers.sequence(1, totalPages)}" class="page-item" th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link fw-semibold" th:href="@{/pap_pati/listpappati(page=${i})}" th:text="${i}">1</a>
            </li>

            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/pap_pati/listpappati(page=${currentPage + 1})}" aria-label="Siguiente">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>

        </ul>
    </nav>

    <div class="mt-4">
        <a href="/dashboard" class="btn btn-secondary">Volver al Panel</a>
    </div>
</main>
</body>
</html>
