<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <title>Personas a cargo</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/proyecte.css}"/>
</head>
<body>
<div class="container mt-4">
    <h1>Personas a cargo del tutor: <span th:text="${tutor.name}" class="text-primary"></span></h1>
    <p class="text-muted">DNI del Tutor: <span th:text="${tutor.dni}"></span></p>

    <div th:if="${#lists.isEmpty(oviUsers)}" class="alert alert-warning">
        Este tutor no tiene actualmente ninguna persona a su cargo.
    </div>

    <table class="table table-striped" th:if="${not #lists.isEmpty(oviUsers)}">
        <thead class="table-dark">
        <tr>
            <th>DNI</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Diversidad Funcional</th>
            <th>Estado</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user: ${oviUsers}">
            <td th:text="${user.dni}"></td>
            <td th:text="${user.name}"></td>
            <td th:text="${user.email}"></td>
            <td th:text="${user.typeOfFunctionalDiversity}"></td>
            <td>
                        <span th:text="${user.status}"
                              th:class="${user.status == 'active' ? 'badge bg-success' : 'badge bg-secondary'}">
                        </span>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="mt-3">
        <a th:href="@{/dashboard}" class="btn btn-secondary">Volver al menú</a>
    </div>
</div>
</body>
</html>
