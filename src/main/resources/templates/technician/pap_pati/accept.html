<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8" />
    <title>Confirmar Aceptación</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-light bg-light mb-4 shadow-sm">
    <div th:replace="~{fragments/base :: navbar}"></div>
</nav>
<div class="container mt-5">
    <div class="card border-success">
        <div class="card-header bg-success text-white">Confirmar Aceptación</div>
        <div class="card-body text-center p-5">
            <h5>¿Aceptar a <span th:text="${pap_pati.name} + ' ' + ${pap_pati.surname}"></span>?</h5>
            <p>DNI: <strong th:text="${pap_pati.dni}"></strong></p>
            <div class="mt-4">
                <a th:href="@{/pap_pati/accept/execute/{dni}(dni=${pap_pati.dni})}" class="btn btn-success">Sí, Aceptar Candidato</a>
                <a th:href="@{/pap_pati/list}" class="btn btn-secondary">Cancelar</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
