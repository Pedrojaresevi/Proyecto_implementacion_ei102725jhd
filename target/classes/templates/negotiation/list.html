<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <title>Gestionar Negociaciones</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="/css/proyecte.css"
          th:href="@{/css/proyecte.css}"/>
</head>
<body>
<nav class="navbar navbar-light bg-light mb-4 shadow-sm">
    <div th:replace="~{fragments/base :: navbar}"></div>
</nav>

<h1>Lista de Negociaciones</h1>
<table>
    <thead>
    <tr>
        <th>Id de la Negociación</th>
        <th>Estatus</th>
        <th>Registro de Comunicaciones</th>
        <th>Fecha de Inicio</th>
        <th>Fecha Fin</th>
        <td></td> <!-- no usar <th> quan no hi ha capçalera -->
        <td></td>
    </tr>
    </thead>
    <tbody>
    <tr th:each="negotiation: ${negotiations}">
        <td th:text="${negotiation.negotiation_Id}"></td>
        <td th:text="${negotiation.status}"></td>
        <td th:text="${negotiation.recordOfComunications}"></td>
        <td th:text="${negotiation.startDate}"></td>
        <td th:text="${negotiation.endDate}"></td>


        <td><a th:href="@{/negotiation/update/{id}(id=${negotiation.negotiation_Id})}" class="btn btn-warning">Edita</a>
        </td>
        <td><a th:href="@{/negotiation/delete/{id}(id=${negotiation.negotiation_Id})}" class="btn btn-danger">Borrar</a>
        </td>
    </tr>
    </tbody>
</table>
<a href="add" class="btn btn-primary">Añadir Negociación</a>
<br><br>
<a href="/dashboard" class="btn btn-secondary">Volver</a>
</body>
</html>
