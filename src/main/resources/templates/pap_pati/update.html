<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8" />
    <title>Modificar PAP/PATI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/proyecte.css" th:href="@{/css/proyecte.css}"/>
</head>
<body>
<nav class="navbar navbar-light bg-light mb-4 shadow-sm">
    <div th:replace="~{fragments/base :: navbar}"></div>
</nav>

<main class="container">
    <h1>Modificar Perfil PAP/PATI</h1>
    <form class="form-horizontal" th:action="@{/pap_pati/update}" th:object="${pap_pati}" method="post">

        <div class="form-group row mb-3">
            <label for="dni" class="control-label col-sm-2">DNI:</label>
            <div class="col-sm-4">
                <input id="dni" type="text" th:field="*{dni}" class="form-control bg-light" readonly>
            </div>
        </div>

        <hr>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="name" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="name" th:field="*{name}" />
            </div>
            <div class="col-md-6 mb-3">
                <label for="surname" class="form-label">Apellidos:</label>
                <input type="text" class="form-control" id="surname" th:field="*{surname}" />
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="phone" class="form-label">Teléfono:</label>
                <input type="text" class="form-control" id="phone" th:field="*{phone}" />
            </div>
            <div class="col-md-8 mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" />
            </div>
        </div>

        <div class="form-group row mb-3">
            <label for="assistant_type" class="control-label col-sm-2">Tipo de Asistente:</label>
            <div class="col-sm-4">
                <select class="form-select" id="assistant_type" th:field="*{assistant_type}">
                    <option value="">Selecciona un tipo...</option>
                    <option value="PAP">PAP</option>
                    <option value="PATI">PATI</option>
                </select>
            </div>
        </div>

        <div class="form-group row mb-3">
            <label for="geographicMobility" class="control-label col-sm-2">Movilidad Geográfica:</label>
            <div class="col-sm-6">
                <select class="form-select" id="geographicMobility" th:field="*{geographicMobility}">
                    <option th:each="provincia : ${provincias}"
                            th:value="${provincia}"
                            th:text="${provincia}"></option>
                </select>
            </div>
        </div>

        <div class="form-group row mb-3">
            <label for="specificTraining" class="control-label col-sm-2">Formación:</label>
            <div class="col-sm-6">
                <select class="form-select" id="specificTraining" th:field="*{specificTraining}">
                    <option th:each="training : ${formacionesDisponibles}"
                            th:value="${training}"
                            th:text="${training}"></option>
                </select>
            </div>
        </div>

        <div class="form-group row mb-3">
            <label for="typeOfExperience" class="control-label col-sm-2">Experiencia:</label>
            <div class="col-sm-6">
                <select class="form-select" id="typeOfExperience" th:field="*{typeOfExperience}">
                    <option th:each="anyo : ${anyosExperiencia}"
                            th:value="${anyo}"
                            th:text="${anyo}"></option>
                </select>
            </div>
        </div>

        <div class="form-group row mb-3">
            <label class="control-label col-sm-2">Habilidades:</label>
            <div class="col-sm-10">
                <div class="row">
                    <div th:each="skill : ${skillsDisponibles}" class="col-md-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{skills}" th:value="${skill}">
                            <label class="form-check-label fw-normal" th:text="${skill}"></label>
                        </div>
                    </div>
                </div>
                <div th:if="${#fields.hasErrors('skills')}" th:errors="*{skills}" class="text-danger small"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="startDate" class="form-label">Disponible desde:</label>
                <input type="date" class="form-control" id="startDate" th:field="*{startDate}" />
            </div>
            <div class="col-md-6 mb-3">
                <label for="endDate" class="form-label">Disponible hasta:</label>
                <input type="date" class="form-control" id="endDate" th:field="*{endDate}" />
            </div>
        </div>

        <div class="form-group row mb-3">
            <label for="status" class="control-label col-sm-2">Estado:</label>
            <div class="col-sm-4">
                <input type="text" class="form-control bg-light" id="status" th:field="*{status}" readonly />
            </div>
        </div>

        <input type="hidden" th:field="*{password}" />
        <input type="hidden" th:field="*{curriculumVitae}" />
        <input type="hidden" th:field="*{address}" />
        <input type="hidden" th:field="*{dateOfBirth}" />

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Actualizar Perfil</button>
            <a th:href="@{/pap_pati/accepted}" class="btn btn-secondary">Volver</a>
        </div>
    </form>
</main>
</body>
</html>
