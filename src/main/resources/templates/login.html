<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Login - Proyecto OVI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div th:replace="~{fragments/base :: navbar}"></div>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-body">
          <h2 class="text-center mb-4">Iniciar Sesión</h2>
          <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
          <form th:action="@{/login}" method="post">
            <div class="mb-3">
              <label class="form-label fw-semibold text-dark small">DNI / NIE / Pasaporte</label>
              <input type="text" name="username" class="col-12 form-control" placeholder="Ej: 12345678Z" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold text-dark small">Contraseña</label>
              <input type="password" name="password" class="col-12 form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
