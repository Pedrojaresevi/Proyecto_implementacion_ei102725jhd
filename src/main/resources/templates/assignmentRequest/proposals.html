<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
  <meta charset="UTF-8" />
  <title>Propuesta de Candidatos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" type="text/css" href="/css/proyecte.css" th:href="@{/css/proyecte.css}"/>
</head>
<body>

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container mt-4">
  <header class="mb-4">
    <h1>Propuesta de Candidatos</h1>
    <p class="lead">Candidatos seleccionados para la solicitud: <strong th:text="${assignmentRequest.request_Id}">ID</strong></p>
  </header>

  <section>
    <h2 class="h4 mb-3">Asistentes Disponibles (PAP/PATI)</h2>
    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
        <tr>
          <th scope="col">ID Propuesta</th>
          <th scope="col">Candidato (DNI)</th>
          <th scope="col">Fecha Propuesta</th>
          <th scope="col">Compatibilidad</th>
          <th scope="col" class="text-center">Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="proposal : ${proposals}">
          <td th:text="${proposal.list_id}">L-REQ1-1</td>
          <td th:text="${proposal.pappati_id}">DNI</td>
          <td th:text="${#dates.format(proposal.proposalDate, 'dd/MM/yyyy')}">01/01/2025</td>
          <td>
            <!-- Barra de progreso visual para el score -->
            <div class="progress" style="min-width: 120px;">
              <div class="progress-bar bg-primary"
                   role="progressbar"
                   th:style="'width: ' + ${proposal.suitabilityScore} + '%'"
                   th:text="${proposal.suitabilityScore} + '%'">
              </div>
            </div>
          </td>
          <td class="text-center">
            <form th:action="@{/assignmentRequest/selectCandidate}" method="post">
              <input type="hidden" name="requestId" th:value="${assignmentRequest.request_Id}" />
              <input type="hidden" name="candidateId" th:value="${proposal.pappati_id}" />
              <button type="submit" class="btn btn-primary btn-sm">Elegir Asistente</button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(proposals)}">
          <td colspan="5" class="text-center text-muted p-4">
            No hay candidatos disponibles que coincidan con los requisitos en este momento.
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>

  <footer class="mt-4">
    <a th:href="@{/assignmentRequest/list}" class="btn btn-secondary">Volver</a>
  </footer>
</main>
</body>
</html>
