<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <title>Gestionar Contratos</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="/css/proyecte.css" th:href="@{/css/proyecte.css}"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/base :: navbar}"></div>


<main class="container pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0 align-middle">
            <i class="bi bi-file-earmark-text" style="font-size: 2rem; color: #0d9488; vertical-align: middle;"></i> Mis contratos
        </h1>
        <a th:href="@{/contract/add}" class="btn btn-primary shadow-sm rounded-pill px-4">
            <i class="bi bi-plus-lg me-1"></i> Nuevo contrato
        </a>
    </div>

    <hr class="mb-4 text-muted">

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle text-center">
            <thead class="table-dark">
            <tr>
                <th>Contract Id</th>
                <th>Request Id</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Status</th>
                <th>Lugar PDF</th>
                <th>PAP/PATI Id</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="contract: ${contracts}">
                <td th:text="${contract.contract_Id}"></td>
                <td th:text="${contract.request_Id}"></td>
                <td th:text="${contract.startDate}"></td>
                <td th:text="${contract.endDate}"></td>
                <td>
                    <span th:text="${contract.status}"
                          th:class="${contract.status == 'in progress' ? 'badge rounded-pill bg-warning text-dark px-3 py-2' :
                                   (contract.status == 'accepted' ? 'badge rounded-pill bg-success px-3 py-2' : 'badge rounded-pill bg-danger px-3 py-2')}">
                    </span>
                    <div th:if="${contract.status == 'refused' and assignmentRequest.rejectReason != null}"
                         class="text-muted small mt-1">
                        <strong>Motivo:</strong>
                        <em th:text="${contract.rejectReason}"></em>
                    </div>
                </td>
                <td th:text="${contract.placeWhereThePDFIsGonnaBeSaved}"></td>
                <td th:text="${contract.pappati_id}"></td>

                <td class="text-center">
                    <div class="d-flex justify-content-center gap-2">
                        <a th:href="@{/contract/update/{contract_Id}(contract_Id=${contract.contract_Id})}" class="btn btn-warning btn-sm">Edita</a>
                        <a th:href="@{/contract/delete/{contract_Id}(contract_Id=${contract.contract_Id})}" class="btn btn-danger btn-sm">Esborra</a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Componente de Paginación para Contratos -->
    <nav th:if="${totalPages > 1}" aria-label="Navegación de contratos" class="mt-4">
        <ul class="pagination justify-content-center">

            <!-- Botón Anterior -->
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/contract/list(page=${currentPage - 1})}" aria-label="Anterior">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <!-- Números de Página -->
            <li th:each="i : ${#numbers.sequence(1, totalPages)}"
                class="page-item"
                th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link" th:href="@{/contract/list(page=${i})}" th:text="${i}">1</a>
            </li>

            <!-- Botón Siguiente -->
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/contract/list(page=${currentPage + 1})}" aria-label="Siguiente">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>

        </ul>
    </nav>

    <div class="mt-4">
        <a href="/dashboard" class="btn btn-secondary">Volver</a>
    </div>
</main>
</body>
</html>
