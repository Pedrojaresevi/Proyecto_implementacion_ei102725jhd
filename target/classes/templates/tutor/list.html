<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <title>Gestionar Tutores</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="/css/proyecte.css"
          th:href="@{/css/proyecte.css}"/>
</head>
<body>
<h1>Lista de Tutores</h1>
<table>
    <thead>
    <tr>
        <th>DNI</th>
        <th>Name</th>
        <th>Email</th>
        <th>Status</th>
        <td></td> <!-- no usar <th> quan no hi ha capçalera -->
        <td></td>
    </tr>
    </thead>
    <tbody>
    <tr th:each="tutor: ${tutors}">
        <td th:text="${tutor.dni}"></td>
        <td th:text="${tutor.name}"></td>
        <td th:text="${tutor.email}"></td>
        <td th:text="${tutor.status}"></td>

        <td><a th:href="@{/tutor/update/{dni}(dni=${tutor.dni})}" class="btn btn-warning">Edita</a>
        </td>
        <td><a th:href="@{/tutor/delete/{dni}(dni=${tutor.dni})}" class="btn btn-danger">Esborra</a>
        </td>
    </tr>
    </tbody>
</table>
<a href="add" class="btn btn-primary">Añadir Tutor</a>
<br><br>
<a href="/" class="btn btn-secondary">Volver</a>
</body>
</html>
