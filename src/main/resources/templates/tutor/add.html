<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registro Tutor - OVI</title>
  <link rel="icon" href="https://ovicastello.org/wp-content/uploads/2020/08/cropped-LOGO_Mesa-de-trabajo-1.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="/css/proyecte.css" th:href="@{/css/proyecte.css}"/>
</head>
<body>

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container pb-5">
  <h1 class="mb-2 text-primary fw-bold">Registrarse como Tutor</h1>
  <p class="text-muted mb-4">Por favor, rellene sus datos para solicitar el alta en el sistema.</p>
  <hr class="mb-4 text-muted">

  <form class="form-horizontal" th:action="@{/tutor/add}" th:object="${tutor}" method="post">

    <h5 class="text-primary text-opacity-75 mb-3 fw-bold">1. Información Personal</h5>
    <div class="form-group row mb-3">
      <label for="dni" class="control-label col-sm-2">DNI / NIE / Pasaporte:</label>
      <div class="col-sm-4">
        <input id="dni" type="text" th:field="*{dni}" class="form-control" maxlength="9">
        <div th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}" class="text-danger"></div>
      </div>
    </div>

    <div class="form-group row mb-3">
      <label for="name" class="control-label col-sm-2">Nombre Completo:</label>
      <div class="col-sm-10">
        <input id="name" type="text" th:field="*{name}" class="form-control" maxlength="100">
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger"></div>
      </div>
    </div>

    <div class="form-group row mb-3">
      <label for="email" class="control-label col-sm-2">Email:</label>
      <div class="col-sm-10">
        <input id="email" type="email" th:field="*{email}" class="form-control" maxlength="100">
        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></div>
      </div>
    </div>

    <hr class="mb-4 text-muted">

    <h5 class="text-primary text-opacity-75 mb-3 fw-bold">2. Contraseña</h5>
    <div class="form-group row mb-3">
      <label for="password" class="control-label col-sm-2">Contraseña:</label>
      <div class="col-sm-10">
        <input id="password" type="password" th:field="*{password}" class="form-control" maxlength="20">
        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger"></div>
      </div>
    </div>

    <button type="submit" class="btn btn-primary mt-3">Finalizar Registro</button>
    <a th:href="@{/}" class="btn btn-secondary mt-3 ms-2">Volver</a>
  </form>
</main>
</body>
</html>
