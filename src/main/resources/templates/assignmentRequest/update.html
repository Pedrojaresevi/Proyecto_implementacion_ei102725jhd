<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
  <meta charset="UTF-8" />
  <title>Modificar Assignment Request</title>
  <link rel="icon" href="https://ovicastello.org/wp-content/uploads/2020/08/cropped-LOGO_Mesa-de-trabajo-1.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" type="text/css" href="/css/proyecte.css" th:href="@{/css/proyecte.css}"/>
</head>
<body>

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container pb-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0 align-middle">
      <i class="bi bi-pencil-square me-2" style="font-size: 2rem; color: #0d9488; vertical-align: middle;"></i>Modificar Solicitud de Asignación
    </h1>
  </div>

  <hr class="mb-4 text-muted">

  <form class="form-horizontal" th:action="@{/assignmentRequest/update}" th:object="${assignmentRequest}" method="post">

    <div class="form-group row mb-3">
      <label for="request_Id" class="control-label col-sm-2">Id Solicitud:</label>
      <div class="col-sm-4">
        <input id="request_Id" type="text" th:field="*{request_Id}" class="form-control bg-light" readonly>
      </div>
    </div>

    <div class="form-group row mb-3">
      <label for="status" class="control-label col-sm-2">Estado Actual:</label>
      <div class="col-sm-4">
        <input id="status" type="text" th:field="*{status}" class="form-control bg-light" readonly>
        <small class="text-muted">El estado solo puede ser modificado por un técnico.</small>
      </div>
    </div>

    <hr>

    <div class="form-group row mb-3">
      <label class="control-label col-sm-2">Tipo de Servicio:</label>
      <div class="col-sm-10">
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" id="tipoPAP" th:field="*{typeOfService}" value="PAP">
          <label class="form-check-label" for="tipoPAP">PAP</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" id="tipoPATI" th:field="*{typeOfService}" value="PATI">
          <label class="form-check-label" for="tipoPATI">PATI</label>
        </div>
      </div>
    </div>

    <div class="form-group row mb-3">
      <label for="serviceLocation" class="control-label col-sm-2">Localización:</label>
      <div class="col-sm-6">
        <select class="form-select" id="serviceLocation" th:field="*{serviceLocation}">
          <option th:each="prov : ${provincias}" th:value="${prov}" th:text="${prov}"></option>
        </select>
      </div>
    </div>

    <div class="form-group row mb-3">
      <label for="requiredTraining" class="control-label col-sm-2">Formación Requerida:</label>
      <div class="col-sm-6">
        <select class="form-select" id="requiredTraining" th:field="*{requiredTraining}">
          <option th:each="training : ${formacionesDisponibles}" th:value="${training}" th:text="${training}"></option>
        </select>
      </div>
    </div>

    <div class="form-group row mb-3">
      <label for="requiredExperience" class="control-label col-sm-2">Experiencia:</label>
      <div class="col-sm-6">
        <select class="form-select" id="requiredExperience" th:field="*{requiredExperience}">
          <option th:each="anyo : ${anyosExperiencia}" th:value="${anyo}" th:text="${anyo}"></option>
        </select>
      </div>
    </div>

    <div class="form-group row mb-3">
      <label class="control-label col-sm-2">Habilidades:</label>
      <div class="col-sm-10">
        <div class="row">
          <div th:each="skill : ${skillsDisponibles}" class="col-12 col-md-4 mb-2">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" name="requiredSkills"
                     th:value="${skill}"
                     th:checked="${habilidadesSeleccionadas != null and habilidadesSeleccionadas.contains(skill)}">
              <label class="form-check-label fw-normal" th:text="${skill}"></label>
            </div>
          </div>
        </div>
        <div th:if="${#fields.hasErrors('requiredSkills')}" th:errors="*{requiredSkills}" class="text-danger mt-2"></div>
      </div>
    </div>

    <div class="form-group row mb-3">
      <label for="requiredStartAvailability" class="control-label col-sm-2">Fecha Inicio:</label>
      <div class="col-sm-4">
        <input type="date" class="form-control" id="requiredStartAvailability" th:field="*{requiredStartAvailability}"/>
      </div>
    </div>

    <div class="form-group row mb-3">
      <label for="requiredEndAvailability" class="control-label col-sm-2">Fecha Fin:</label>
      <div class="col-sm-4">
        <input type="date" class="form-control" id="requiredEndAvailability" th:field="*{requiredEndAvailability}"/>
      </div>
    </div>

    <input type="hidden" th:field="*{oviuser_id}" />
    <input type="hidden" th:field="*{tutor_id}" />
    <input type="hidden" th:field="*{requestDate}" />

    <div class="mt-4">
      <button type="submit" class="btn btn-primary">Actualizar Solicitud</button>
      <a th:href="@{/assignmentRequest/list}" class="btn btn-secondary">Volver</a>
    </div>
  </form>
</main>
</body>
</html>
