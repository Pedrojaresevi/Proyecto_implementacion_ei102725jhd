<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Mis Negociaciones</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/proyecte.css}"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0 align-middle">
            <i class="bi bi-chat-dots me-2" style="font-size: 2rem; color: #0d9488; vertical-align: middle;"></i>Mis negociaciones
        </h1>
        <a th:href="@{/negotiation/add}" class="btn btn-primary shadow-sm rounded-pill px-4">
            <i class="bi bi-plus-lg me-1"></i> Nueva negociación
        </a>
    </div>

    <hr class="mb-4 text-muted">

    <div class="list-group shadow-sm bg-white rounded">
        <div th:each="neg : ${negotiations}" class="list-group-item list-group-item-action d-flex align-items-center p-3 border-bottom">

            <div class="rounded-circle bg-primary text-white d-flex justify-content-center align-items-center shadow-sm"
                 style="width: 55px; height: 55px; min-width: 55px; font-size: 1.5rem;">
                <span th:text="${#strings.substring(neg.negotiation_Id,0,1)}">N</span>
            </div>

            <div class="ms-3 flex-grow-1">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-1 fw-bold" th:text="'Negociación #' + ${neg.negotiation_Id}">ID</h5>
                    <small class="text-muted" th:text="${#dates.format(neg.startDate, 'dd/MM/yyyy')}">Fecha</small>
                </div>

                <p class="mb-1 text-truncate text-secondary" style="max-width: 350px;">
                    <i class="bi bi-check2-all text-info"></i>
                    <span th:if="${neg.recordOfComunications != null and !neg.recordOfComunications.isEmpty()}"
                          th:text="${neg.recordOfComunications}"></span>
                    <span th:unless="${neg.recordOfComunications != null and !neg.recordOfComunications.isEmpty()}">
                        Escribe el primer mensaje...
                    </span>
                </p>
            </div>

            <div class="ms-3 d-flex flex-column gap-2">
                <a th:href="@{'/negotiation/chat/' + ${neg.negotiation_Id}}" class="btn btn-primary rounded-pill px-3">
                    Abrir Chat <i class="bi bi-chat-text"></i>
                </a>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(negotiations)}" class="p-5 text-center text-muted">
            <i class="bi bi-chat-square-dots" style="font-size: 3rem;"></i>
            <p class="mt-3">No tienes negociaciones activas en este momento.</p>
        </div>
    </div>

    <div class="mt-4">
        <a href="/dashboard" class="btn btn-secondary">Volver</a>
    </div>

    <nav th:if="${totalPages > 1}" aria-label="Navegación de negociaciones" class="mt-5">
        <ul class="pagination justify-content-center">

            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/negotiation/user/{dni}(dni=${dniOwner}, page=${currentPage - 1})}" aria-label="Anterior">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <li th:each="i : ${#numbers.sequence(1, totalPages)}" class="page-item" th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link" th:href="@{/negotiation/user/{dni}(dni=${dniOwner}, page=${i})}" th:text="${i}">1</a>
            </li>

            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/negotiation/user/{dni}(dni=${dniOwner}, page=${currentPage + 1})}" aria-label="Siguiente">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>

        </ul>
    </nav>
</main>
</body>
</html>
