<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ca">
<head>
    <meta charset="UTF-8" />
    <title>Modificar OviUser</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/proyecte.css" th:href="@{/css/proyecte.css}"/>
</head>
<body>
<nav class="navbar navbar-light bg-light mb-4 shadow-sm">
    <div th:replace="~{fragments/base :: navbar}"></div>
</nav>

<main class="container">
    <h1 class="mb-4">Modificar Perfil OviUser</h1>
    <form class="form-horizontal" th:action="@{/oviUser/update}" th:object="${oviUser}" method="post">

        <div class="form-group row mb-3">
            <label for="dni" class="control-label col-sm-2">DNI:</label>
            <div class="col-sm-4">
                <input id="dni" type="text" th:field="*{dni}" class="form-control bg-light" maxlength="9" readonly>
            </div>
            <div th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}" class="text-danger small"></div>
        </div>

        <hr>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="name" class="form-label">Nombre:</label>
                <input type="text" class="form-control" id="name" th:field="*{name}" maxlength="50" />
                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger small"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" th:field="*{email}" maxlength="150"/>
                <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger small"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12 mb-3">
                <label for="address" class="form-label">Dirección:</label>
                <input type="text" class="form-control" id="address" th:field="*{address}" maxlength="200"/>
                <div th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="text-danger small"></div>
            </div>
        </div>

        <div class="form-group row mb-3">
            <label for="dateOfBirth" class="control-label col-sm-2">Fecha de nacimiento:</label>
            <div class="col-sm-4">
                <input type="date" class="form-control" id="dateOfBirth" th:field="*{dateOfBirth}" />
                <div th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}" class="text-danger"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="entityThatIsInvolved" class="form-label">Entidad en la que está involucrado:</label>
                <input type="text" class="form-control" id="entityThatIsInvolved" th:field="*{entityThatIsInvolved}" maxlength="150"/>
                <div th:if="${#fields.hasErrors('entityThatIsInvolved')}" th:errors="*{entityThatIsInvolved}" class="text-danger small"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="typeOfFunctionalDiversity" class="form-label">Tipo de diversidad funcional:</label>
                <input type="text" class="form-control" id="typeOfFunctionalDiversity" th:field="*{typeOfFunctionalDiversity}" maxlength="150"/>
                <div th:if="${#fields.hasErrors('typeOfFunctionalDiversity')}" th:errors="*{typeOfFunctionalDiversity}" class="text-danger small"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12 mb-3">
                <label for="lifePlan" class="form-label">Plan de Vida (Life Plan):</label>
                <input type="text" class="form-control" id="lifePlan" th:field="*{lifePlan}" maxlength="150"/>
                <div th:if="${#fields.hasErrors('lifePlan')}" th:errors="*{lifePlan}" class="text-danger small"></div>
            </div>
        </div>

        <hr>
        <h5 class="mb-3 text-secondary">Información Administrativa (No modificable)</h5>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="tutor_id" class="form-label">ID Tutor:</label>
                <input type="text" class="form-control bg-light" id="tutor_id" th:field="*{tutor_id}" readonly />
            </div>

            <div class="col-md-4 mb-3">
                <label for="dateOfAcceptance" class="form-label">Fecha de aceptación:</label>
                <input type="date" class="form-control bg-light" id="dateOfAcceptance" th:field="*{dateOfAcceptance}" readonly />
            </div>

            <div class="col-md-4 mb-3">
                <label for="status" class="form-label">Estado:</label>
                <input type="text" class="form-control bg-light" id="status" th:field="*{status}" readonly />
            </div>
        </div>

        <input type="hidden" th:field="*{password}" />
        <input type="hidden" th:field="*{dateOfBirth}" />

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Actualizar Perfil</button>
            <a th:href="@{/oviUser/accepted}" class="btn btn-secondary">Volver</a>
        </div>
    </form>
</main>
</body>
</html>
