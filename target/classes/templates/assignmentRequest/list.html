<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <title>Mis Solicitudes</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/proyecte.css}"/>
</head>
<body>

<div th:replace="~{fragments/base :: navbar}"></div>

<main class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0 align-middle">
            <i class="bi bi-person-plus me-2" style="font-size: 2rem; color: #0d9488; vertical-align: middle;"></i>Mis Solicitudes
        </h1>
        <a th:href="@{/assignmentRequest/add}" class="btn btn-primary shadow-sm rounded-pill px-4">
            <i class="bi bi-plus-lg me-1"></i> Nueva solicitud
        </a>
    </div>

    <hr class="mb-4 text-muted">

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle text-center">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Tipo de servicio</th>
                <th>Disponibilidad</th>
                <th>Localización</th>
                <th>Formación requerida</th>
                <th>Experiencia requerida</th>
                <th>Habilidades requeridas</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="assignmentRequest: ${assignmentRequests}">
                <td th:text="${assignmentRequest.request_Id}"></td>
                <td th:text="${assignmentRequest.requestDate}"></td>
                <td th:text="${assignmentRequest.typeOfService}"></td>
                <td th:text="${assignmentRequest.requiredStartAvailability} + ' - ' + ${assignmentRequest.requiredEndAvailability}"></td>
                <td th:text="${assignmentRequest.serviceLocation}"></td>
                <td th:text="${assignmentRequest.requiredTraining}"></td>
                <td th:text="${assignmentRequest.requiredExperience}"></td>
                <td th:text="${assignmentRequest.requiredSkills}"></td>

                <td>
                    <span th:text="${assignmentRequest.status}"
                          th:class="${assignmentRequest.status == 'in progress' ? 'badge rounded-pill bg-warning text-dark px-3 py-2' :
                                   (assignmentRequest.status == 'accepted' ? 'badge rounded-pill bg-success px-3 py-2' : 'badge rounded-pill bg-danger px-3 py-2')}">
                    </span>
                    <div th:if="${assignmentRequest.status == 'refused' and assignmentRequest.rejectReason != null}"
                         class="text-muted small mt-1">
                        <strong>Motivo:</strong>
                        <em th:text="${assignmentRequest.rejectReason}"></em>
                    </div>
                </td>

                <td>
                    <div th:if="${assignmentRequest.status == 'in progress'}" class="d-flex gap-1 justify-content-center">
                        <a th:href="@{/assignmentRequest/update/{id}(id=${assignmentRequest.request_Id})}"
                           class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/assignmentRequest/delete/{id}(id=${assignmentRequest.request_Id})}"
                           class="btn btn-danger btn-sm">Eliminar</a>
                    </div>

                    <div th:if="${assignmentRequest.status == 'accepted'}">
                        <a th:href="@{/assignmentRequest/proposals/{id}(id=${assignmentRequest.request_Id})}"
                           class="btn btn-sm btn-primary px-3 shadow-sm">
                            <i class="bi bi-people-fill me-1"></i> Candidatos
                        </a>
                    </div>

                    <div th:if="${assignmentRequest.status == 'refused'}">
                        <span class="text-muted small">Sin acciones disponibles</span>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(assignmentRequests)}">
                <td colspan="10" class="text-muted p-4">
                    No tienes solicitudes registradas aún.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav aria-label="Navegación de páginas" th:if="${totalPages > 1}" class="mt-4">
        <ul class="pagination justify-content-center custom-pagination">

            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/assignmentRequest/list(page=${currentPage - 1})}" aria-label="Anterior">
                    <i class="bi bi-chevron-left"></i>
                </a>
            </li>

            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${currentPage == i} ? 'active'">
                <a class="page-link fw-semibold" th:href="@{/assignmentRequest/list(page=${i})}" th:text="${i + 1}">1</a>
            </li>

            <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/assignmentRequest/list(page=${currentPage + 1})}" aria-label="Siguiente">
                    <i class="bi bi-chevron-right"></i>
                </a>
            </li>

        </ul>
    </nav>

    <div class="mt-3 d-flex gap-2">
        <a href="/dashboard" class="btn btn-secondary">Volver</a>
    </div>
</main>
</body>
</html>
